const EXLIB = [{"name":"Back Squat","sets_reps":"3-4 x 5-10","rest":"2-4 min","why":"A free-weight squat trains coordinated knee and hip extension while the torso resists flexion. Bar position, limb lengths, stance and depth alter the relative joint demands.","setup":["Set the bar securely and create a stable upper-back shelf.","Brace before unracking and take a controlled stance.","Descend with knees tracking the toes and whole feet loaded.","Use the deepest controlled range that preserves balance and position.","Drive the floor away and finish tall without excessive lumbar extension."],"mistakes":["Heels lifting or feet rolling","Knees collapsing inward under load","Losing trunk position and turning the ascent into a good-morning","Bouncing into a depth you cannot control"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Front Squat","sets_reps":"3 x 5-10","rest":"2-3 min","why":"The front-loaded bar generally encourages a more upright torso and increases the demand to maintain thoracic and trunk position. It is useful when the front-rack position is comfortable.","setup":["Secure a clean or cross-arm rack position.","Keep elbows high enough to maintain the bar shelf.","Brace and descend between the hips with whole feet planted.","Allow knees to travel naturally while maintaining balance.","Stand by extending knees and hips together."],"mistakes":["Elbows dropping and bar rolling","Trying to keep shins artificially vertical","Losing the brace at the bottom","Using a grip/rack position that irritates wrists or shoulders"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Hack Squat Machine","sets_reps":"3-4 x 6-15","rest":"2-3 min","why":"The guided sled reduces balance demands and can provide a large knee-flexion range. Foot placement changes the external moment arms, but should be selected for comfort and stable whole-foot pressure.","setup":["Set shoulders and back firmly into the pads.","Place feet where the bottom position is stable and comfortable.","Unlock safeties and descend under control.","Let knees track in line with toes; keep heels planted.","Drive the platform away without bouncing or forceful knee lockout."],"mistakes":["Feet too low/high for your anatomy","Pelvis rolling away from the pad","Knees collapsing inward","Shortening range simply to add plates"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Pendulum Squat","sets_reps":"3 x 6-12","rest":"2-3 min","why":"The arcing machine path can allow deep knee flexion with strong torso support. Resistance can feel especially challenging through the lower portion depending on the machine geometry.","setup":["Adjust foot position and shoulder pads before loading heavily.","Brace against the pad and descend smoothly.","Use a controlled comfortable depth with heels planted.","Drive upward through the whole foot.","Keep tension rather than bouncing off the bottom."],"mistakes":["Forcing maximum depth","Lifting heels","Relaxing into the bottom stop","Adding load before learning the machine's resistance curve"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Smith Machine Squat","sets_reps":"3 x 6-12","rest":"2-3 min","why":"The fixed bar path removes some balance requirements. Foot position relative to the bar can be adjusted to find a stable combination of knee and hip motion.","setup":["Set safety stops before loading.","Position the bar and feet so the fixed path feels natural.","Brace and descend under control.","Keep whole-foot pressure and knees tracking toes.","Stand smoothly without using the safeties as a bounce point."],"mistakes":["No safeties set","Feet placed by copying someone else's stance","Excessive lumbar movement","Using the fixed path despite joint discomfort"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Belt Squat","sets_reps":"3 x 8-15","rest":"2 min","why":"The external load is attached near the pelvis, reducing the need to support a bar on the shoulders and often reducing axial loading of the trunk.","setup":["Secure the belt correctly and centre yourself over the loading point.","Use supports only for balance, not to pull yourself up.","Squat with whole feet planted and knees tracking naturally.","Descend to a repeatable depth.","Stand by extending knees and hips together."],"mistakes":["Leaning heavily on handles","Belt placed uncomfortably","Too much forward/backward drift","Using load that changes the squat pattern"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"45-Degree Leg Press","sets_reps":"3-4 x 8-15","rest":"2-3 min","why":"A supported compound leg exercise that permits high local muscular loading. Deeper knee flexion increases knee-extensor demand while hip flexion increases hip-extensor contribution.","setup":["Adjust the seat/back position so the pelvis stays supported.","Place feet in a stable position and unlock the sled.","Lower slowly until just before the pelvis begins to roll.","Keep knees tracking the feet.","Press through the whole foot and avoid forceful lockout."],"mistakes":["Lower back/pelvis lifting from pad","Knees collapsing","Hands pushing on knees","Very short range used only to move more load"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Horizontal / Seated Leg Press","sets_reps":"3 x 8-15","rest":"90 sec-3 min","why":"The more horizontal machine orientation changes the loading feel but the training task remains coordinated knee and hip extension against a guided resistance.","setup":["Set the seat so the bottom range is controlled.","Place the full foot securely on the platform.","Lower until hips remain stable against the seat.","Press smoothly while knees track toes.","Do not slam the stack or lock the knees aggressively."],"mistakes":["Seat too close causing pelvic tuck","Seat too far causing tiny range","Stack crashing","Knee collapse"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Single-Leg Press","sets_reps":"2-3 x 8-15/leg","rest":"90-120 sec","why":"One-leg pressing reduces the absolute machine load required and can help train each side independently while the torso remains supported.","setup":["Use a moderate load and place one foot centrally.","Keep pelvis square against the pad.","Lower only as far as the pelvis remains stable.","Track knee over the foot.","Press without twisting or using the non-working leg."],"mistakes":["Pelvic rotation","Foot placed too high/low to control","Using the free leg for assistance","Loading it like the bilateral version too soon"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Leg Extension","sets_reps":"2-4 x 10-20","rest":"60-120 sec","why":"The leg extension directly loads knee extension and isolates the quadriceps without hip-extension demand. It is useful for adding quad volume with low balance and trunk fatigue.","setup":["Align the knee with the machine pivot as closely as the design allows.","Set the shin pad above the ankle.","Keep hips and back supported.","Extend the knee smoothly without kicking the weight.","Lower under control to the chosen start position."],"mistakes":["Machine axis badly misaligned","Hips lifting from seat","Swinging the stack","Using painful end-range just because the machine allows it"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Bulgarian Split Squat","sets_reps":"2-3 x 8-15/leg","rest":"90-150 sec","why":"A rear-foot-elevated split squat provides substantial unilateral loading with relatively modest external weight. Torso angle and stride influence the balance of hip and knee demand.","setup":["Set rear foot on a comfortable support rather than excessively high.","Find a stance that lets the front foot stay fully planted.","Descend mostly straight down while maintaining balance.","Track the front knee naturally with the foot.","Drive through the front leg; use support if balance limits the target muscles."],"mistakes":["Rear foot too high","Pushing strongly from back leg","Losing front-foot pressure","Balance failure ending the set before the leg is challenged"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Reverse Lunge","sets_reps":"2-3 x 8-15/leg","rest":"90 sec","why":"Stepping backward often makes the movement easier to control than a forward lunge. It trains unilateral force production and deceleration.","setup":["Stand tall and step one leg backward.","Lower under control with the front foot planted.","Keep pelvis and trunk organised.","Push through the front leg to return.","Alternate or complete one side at a time."],"mistakes":["Step too narrow causing instability","Front heel lifting","Pushing excessively from back foot","Rushing the return"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Walking Lunge","sets_reps":"2-3 x 10-20 steps","rest":"90-120 sec","why":"Walking lunges add locomotion and repeated single-leg transitions. They are effective but can be more balance- and space-demanding than stationary split squats.","setup":["Take a controlled step and plant the whole foot.","Lower through both knees within a comfortable range.","Drive through the lead leg into the next step.","Keep the trunk stable and avoid rushing.","Use enough space to maintain consistent stride length."],"mistakes":["Overstriding","Narrow tightrope stance","Bouncing between steps","Using momentum to avoid the working range"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Step-Up","sets_reps":"2-3 x 8-12/leg","rest":"90 sec","why":"Step-ups train the lead leg to raise the body onto a platform. Box height changes the knee and hip flexion required and should be chosen so the movement remains controlled.","setup":["Choose a box height you can use without pushing off strongly from the floor leg.","Place the full lead foot on the box.","Lean only as much as needed for balance.","Drive through the lead leg to stand.","Lower under control rather than dropping."],"mistakes":["Box too high","Jumping from trailing leg","Only the toes on the box","Uncontrolled descent"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Romanian Deadlift","sets_reps":"3 x 6-12","rest":"2-3 min","why":"The RDL loads the hip hinge with relatively little knee movement. The hamstrings lengthen across the hip while the trunk remains braced and the bar stays close.","setup":["Stand with the load close to the thighs and soften the knees.","Brace and push the hips backward.","Keep the load close while the torso inclines.","Stop when hamstring range or trunk position limits further descent.","Drive hips forward to stand without leaning back."],"mistakes":["Turning it into a squat","Bar drifting away","Chasing floor depth","Lumbar rounding or hyperextension","Knees locking rigidly"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Smith Machine RDL","sets_reps":"3 x 8-12","rest":"2 min","why":"The fixed bar path reduces balance and bar-path demands, which can make it easier to focus on the hip hinge and hamstring lengthening.","setup":["Set safeties and start with the bar close to the thighs.","Use soft knees and brace.","Push hips backward while keeping the bar path close.","Stop at your controlled hamstring range.","Extend the hips to return."],"mistakes":["Standing too far from the bar path","Excessive knee bend","Rounding to create more depth","Using safeties as a bounce point"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"45-Degree Back Extension","sets_reps":"2-3 x 10-20","rest":"60-120 sec","why":"When performed as a hip hinge, the 45-degree back extension trains the posterior chain with modest external load. Pad position and spinal control determine whether the movement is hip- or spine-dominant.","setup":["Set the pad below the front of the hips so the hip can flex.","Brace and hinge forward under control.","Keep the spine in a comfortable stable position.","Extend the hips until the body is in line.","Add load only after bodyweight control is established."],"mistakes":["Pad too high blocking hip motion","Hyperextending at the top","Rounding aggressively under load","Swinging the torso"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Seated Leg Curl","sets_reps":"3 x 8-15","rest":"60-120 sec","why":"The hip-flexed seated position places the biarticular hamstrings at a relatively long muscle length while they flex the knee, making it a valuable complement to hip hinges.","setup":["Align the knee with the machine pivot.","Secure the thigh pad so the hips remain down.","Start with the knees long but comfortable.","Curl the heels down/back smoothly.","Pause briefly and return under control."],"mistakes":["Hips lifting","Thigh pad too loose","Stack crashing","Shortening the stretched position to use more load"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Lying Leg Curl","sets_reps":"3 x 10-15","rest":"60-90 sec","why":"This curl isolates knee flexion with the hip closer to neutral. It complements RDLs because the hamstrings are trained through a different joint action.","setup":["Align the knee with the pivot and pad above the heel.","Keep hips against the machine.","Curl without lifting the pelvis.","Control the top and lower slowly.","Keep the ankle position consistent."],"mistakes":["Hips popping up","Overarching lower back","Kicking the weight","Partial reps from excessive load"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Standing Single-Leg Curl","sets_reps":"2-3 x 10-15/leg","rest":"60-90 sec","why":"The unilateral setup allows each hamstring to work independently and can expose meaningful side-to-side differences.","setup":["Align the working knee with the machine pivot.","Stabilise the pelvis and torso.","Curl the pad smoothly without hip rotation.","Pause and lower under control.","Complete both sides with the same standard."],"mistakes":["Rotating pelvis","Using torso momentum","Different range between sides","Too much load to control"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Hip Thrust","sets_reps":"3 x 8-15","rest":"90-150 sec","why":"The hip thrust loads hip extension strongly near the top of the movement. The bench supports the upper torso while the glutes create the majority of the hip-extension torque.","setup":["Place the upper back securely on the bench/pad.","Set feet so the top position is stable.","Brace ribs over pelvis.","Drive hips upward through hip extension.","Finish with glutes rather than lumbar hyperextension and lower slowly."],"mistakes":["Bench position unstable","Feet too far/close","Overarching at lockout","Bar/pad poorly positioned on pelvis"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Glute Drive Machine","sets_reps":"3 x 8-15","rest":"90-120 sec","why":"A guided hip-thrust machine simplifies setup and provides a stable way to train high-effort hip extension.","setup":["Set belt/pad securely across the pelvis.","Plant feet in the machine's stable position.","Brace before initiating the rep.","Extend hips until the torso/pelvis reaches a controlled finish.","Lower into a comfortable range without relaxing the stack."],"mistakes":["Belt placed on abdomen rather than pelvis","Lumbar hyperextension","Feet slipping","Bouncing the bottom"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Cable Pull-Through","sets_reps":"2-3 x 10-15","rest":"60-90 sec","why":"The low cable pulls backward between the legs, creating a hip-hinge resistance without loading the spine from above.","setup":["Face away from a low cable with rope between the legs.","Walk forward enough to create cable tension.","Brace and hinge hips backward.","Drive hips forward while arms remain passive.","Finish tall without leaning back."],"mistakes":["Squatting instead of hinging","Pulling with arms","Overextending spine","Standing too close to stack"],"coaching":"The target muscles should become progressively challenged while the joints remain comfortable and the movement standard stays repeatable. End the set when range, control or position deteriorates substantially."},{"name":"Hip Adduction Machine","sets_reps":"2-3 x 10-20","rest":"60-90 sec","why":"The adductors pull the thigh toward the midline and several also contribute to hip extension anging the movement standard."},{"name":"Landmine Press","sets_reps":"3 x 8-15","rest":"90 sec","why":"The landmine creates an angled press between horizontal and vertical. The arc can be comfortable for lifters who do not prefer fully overhead pressing.","setup":["Secure the bar in a landmine attachment.","Hold the end at shoulder level.","Use split, half-kneeling or standing stance.","Press forward/up along the bar arc.","Allow natural scapular motion and return slowly."],"mistakes":["Leaning excessively","Rotating torso on single-arm reps","Pressing straight up against the bar arc","Using unstable improvised anchoring"],"coaching":"The target region should be challenged without sharp or escalating shoulder, elbow or wrist discomfort. Keep setup and range consistent enough that progression reflects improved capacity rather than changing the movement standard."},{"name":"Pull-Up","sets_reps":"3 x 5-10","rest":"2-3 min","why":"Pull-ups move the body toward a fixed bar. They combine shoulder and elbow motion with scapular control and are highly specific to bodyweight pulling strength.","setup":["Grip the bar securely at a comfortable width.","Begin from a controlled hang appropriate to your shoulders.","Brace the trunk and initiate the pull without swinging.","Drive elbows down as the chest approaches the bar.","Lower under control to the chosen start position."],"mistakes":["Kipping unintentionally","Chin reaching while the body stays low","Shoulders losing control at the bottom","Range shortening as fatigue rises"],"coaching":"The set should be limited primarily by the intended pulling muscles rather than uncontrolled torso movement. Straps can be a legitimate tool when grip repeatedly limits back work, but grip should also be trained where appropriate."},{"name":"Neutral-Grip Pull-Up","sets_reps":"3 x 6-10","rest":"2-3 min","why":"A neutral grip often permits strong elbow-flexor contribution and may feel comfortable at the wrist and shoulder while preserving the v me":"Single-Arm Cable Pressdown","sets_reps":"2-3 x 10-20/arm","rest":"60 sec","why":"Single-arm cable work allows each elbow and wrist to find a natural path and helps match training volume between sides.","setup":["Use a single handle or cable ball.","Stand square and stabilise upper arm.","Extend elbow to a controlled finish.","Keep shoulder quiet.","Return slowly and repeat equally."],"mistakes":["Torso rotation","Shoulder extension","Elbow drifting","Different stance side to side"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Reverse-Grip Pressdown","sets_reps":"2-3 x 12-20","rest":"60 sec","why":"The underhand grip changes wrist/forearm position but does not uniquely isolate one triceps head. It is primarily an alternative pressdown when comfortable.","setup":["Use a light straight/EZ attachment.","Grip underhand at comfortable width.","Keep wrists neutral and elbows near sides.","Extend smoothly.","Return under control."],"mistakes":["Using excessive load","Wrists collapsing","Elbows moving","Assuming the grip 'isolates' one head"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Overhead Rope Triceps Extension","sets_reps":"3 x 10-20","rest":"60-90 sec","why":"The long head crosses the shoulder. Placing the arms overhead lengthens it at the shoulder while elbow extension provides the primary resistance.","setup":["Set rope on a low or high cable according to setup.","Face away and bring upper arms overhead.","Brace ribs and keep elbows comfortably forward.","Extend elbows without changing shoulder position greatly.","Return into a controlled stretch."],"mistakes":["Lumbar arch","Elbows flaring excessively","Shoulders moving to finish","Forcing deep painful stretch"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Single-Arm Overhead Cable Extension","sets_reps":"2-3 x 10-20/arm","rest":"60 sec","why":"Independent overhead cable work allows a customised elbow path and can make side-to-side differences easier to manage.","setup":["Set cable so resistance pulls behind/above the arm.","Stabilise upper arm overhead.","Extend the elbow smoothly.","Keep ribs controlled.","Return to a comfortable stretch."],"mistakes":["Torso side-bending","Elbow wandering","Shoulder pain ignored","Too much load"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Dumbbell Overhead Triceps Extension","sets_reps":"2-3 x 10-15","rest":"60-90 sec","why":"A dumbbell provides a simple overhead elbow-extension exercise but requires shoulder mobility and secure handling.","setup":["Sit or stand stable and hold dumbbell securely.","Bring it overhead with elbows comfortably forward.","Lower behind the head under control.","Extend elbows without excessive back arch.","Finish with arms controlled overhead."],"mistakes":["Unsafe grip","Elbows flaring dramatically","Lumbar extension","Forcing shoulder range"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"EZ-Bar Skull Crusher","sets_reps":"2-3 x 8-15","rest":"90 sec","why":"Lying extensions load the triceps while the upper arm is relatively fixed. Allowing a small shoulder angle can place the bar behind the head and maintain tension without forcing the elbow.","setup":["Lie securely and hold EZ bar over shoulders.","Set upper arms at a comfortable slight backward angle.","Bend elbows to lower bar toward/behind head.","Extend elbows while upper arms remain mostly stable.","Use a spot/safe setup when loading heavily."],"mistakes":["Bar lowered directly to face without control","Elbows flaring","Shoulders moving excessively","Too much weight"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Cable Skull Crusher","sets_reps":"2-3 x 10-15","rest":"60-90 sec","why":"A cable can maintain tension through the lying or incline extension and avoids carrying a loaded bar into position.","setup":["Set cable behind the bench and choose rope/bar.","Position upper arms securely.","Flex elbows into a controlled stretch.","Extend without moving shoulders excessively.","Return slowly."],"mistakes":["Bench/cable setup unstable","Elbows drifting","Overarching","Stack crashing"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Triceps Extension Machine","sets_reps":"3 x 10-20","rest":"60-90 sec","why":"A selectorised extension machine supports the body and often the upper arms, reducing stability demands and making high-effort sets straightforward.","setup":["Align elbow with machine pivot.","Secure upper arms/pads.","Extend through a comfortable range.","Pause without forceful lockout.","Return slowly."],"mistakes":["Axis misalignment","Shoulders lifting","Stack crashing","Painful lockout"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Wrist Curl","sets_reps":"2-3 x 12-25","rest":"45-60 sec","why":"Wrist curls directly train the forearm flexor group. Small ranges and light-to-moderate loads are appropriate because the wrist joint is the primary moving segment.","setup":["Support forearms on thighs/bench.","Hold bar/dumbbells palms up.","Allow controlled wrist extension.","Curl the hand upward through wrist flexion.","Lower slowly."],"mistakes":["Elbows moving","Finger grip failing unsafely","Bouncing","Excessive load"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Reverse Wrist Curl","sets_reps":"2-3 x 12-25","rest":"45-60 sec","why":"This directly trains wrist extensor musculature using a palms-down position and generally requires lighter loads than wrist flexion.","setup":["Support forearms securely.","Use overhand grip.","Lower hands into comfortable flexion.","Extend wrists upward.","Return slowly."],"mistakes":["Using too much load","Forearms lifting","Rapid bouncing","Painful range"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Cable Wrist Curl","sets_reps":"2-3 x 15-25","rest":"45-60 sec","why":"The cable maintains resistance throughout the small wrist arc and permits small weight increments.","setup":["Set low cable and support forearms if possible.","Keep elbows/forearms still.","Flex wrists against the cable.","Pause briefly.","Return under control."],"mistakes":["Turning it into an elbow curl","Body movement","Excessive load","Stack slamming"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Pronation / Supination with Dumbbell","sets_reps":"2 x 10-15 each direction","rest":"45 sec","why":"Using a light offset dumbbell or lever creates rotational torque around the forearm. This is a control exercise, not a heavy strength lift.","setup":["Support the elbow at roughly 90 degrees.","Hold one end of a light dumbbell if appropriate.","Rotate slowly through a comfortable range.","Keep elbow and shoulder still.","Reverse with control."],"mistakes":["Heavy load","Shoulder rotating instead of forearm","Fast end-range movement","Painful range"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Farmer Carry","sets_reps":"3-5 x 20-40 m","rest":"60-120 sec","why":"Heavy carries train sustained grip while the trunk and shoulder girdle stabilise during walking. They bridge forearm work and general conditioning.","setup":["Choose implements you can hold securely.","Stand tall and brace before walking.","Take controlled steps with shoulders stable.","Maintain grip without letting weights strike the legs.","Set weights down under control."],"mistakes":["Load too heavy to walk safely","Rushing turns","Shoulders collapsing","Dropping implements"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Suitcase Carry","sets_reps":"2-4 x 20-40 m/side","rest":"60 sec","why":"Holding load on one side creates a lateral-flexion challenge that the trunk resists while grip supports the implement.","setup":["Hold one dumbbell/kettlebell at the side.","Stand tall without leaning away.","Walk with normal controlled steps.","Keep pelvis and shoulders level.","Switch sides and match distance."],"mistakes":["Leaning","Weight resting on thigh","Unequal distances","Rushing"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Plate Pinch Hold","sets_reps":"2-4 x 15-40 sec","rest":"60 sec","why":"Pinching plates trains a grip pattern different from wrapping the hand around a bar and can be a simple grip accessory.","setup":["Use smooth-sided plates suitable for safe pinching.","Pinch securely with fingers and thumb.","Stand over a clear area.","Hold for the programmed time.","Set plates down before grip opens unexpectedly."],"mistakes":["Using plates that cannot be held safely","Holding over feet","Going to uncontrolled failure","Shoulder shrugging unnecessarily"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."},{"name":"Dead Hang","sets_reps":"2-4 x 15-45 sec","rest":"60 sec","why":"A dead hang can train grip endurance while exposing the shoulders to an overhead position. Shoulder comfort determines whether a relaxed or more active hang is appropriate.","setup":["Use a secure pull-up bar.","Grip fully with hands at comfortable width.","Step into the hang rather than jumping unpredictably.","Maintain the shoulder position that is comfortable and intentional.","Step down before grip fails suddenly."],"mistakes":["Hanging through shoulder pain","Unsafe bar","Swinging","Testing maximal duration every session"],"coaching":"Arm isolation should create local muscular effort without needing large torso movement. Because elbow and wrist tissues can become irritated by excessive repetitive loading, add direct arm volume gradually and change grips or exercises when a variation is persistently uncomfortable."}];
const EXMAP = {"Ab roller":null,"Adductor machine":null,"Arnold press":null,"Assisted pull-up":66,"Back squat":0,"Barbell bench press":33,"Barbell hip thrust":20,"Bulgarian split squat":10,"Cable Y-raise":58,"Cable crunch":null,"Cable curl":106,"Cable fly":46,"Cable lateral raise":55,"Cable pullover":88,"Cable rear-delt fly":60,"Cable row":94,"Calf press":29,"Calf raise":27,"Chest-supported row":74,"Close-grip pulldown":null,"DB Romanian deadlift":14,"DB bench press":35,"DB curl":99,"DB lateral raise":54,"DB shoulder press":50,"Dip machine":44,"Face pull":61,"Farmer carry":128,"Flat DB press":35,"Front squat / Smith squat":1,"Glute abduction":null,"Goblet squat":null,"Hack squat":2,"Hammer curl":108,"Hanging knee raise":null,"Hip thrust":20,"Hip thrust machine":20,"Incline DB curl":101,"Incline DB press":36,"Incline barbell press":34,"Incline cable press":36,"Incline machine press":36,"Landmine press":63,"Lat pulldown":70,"Leg curl":17,"Leg extension":9,"Leg press":8,"Leg press heavy":8,"Low-to-high cable fly":47,"Lying leg curl":18,"Machine chest press":40,"Machine lateral raise":56,"Machine shoulder press":51,"Neutral pulldown":69,"One-arm cable row":78,"One-arm machine row":79,"Overhead cable extension":119,"Pallof press":null,"Pec deck":45,"Plate-loaded chest press":39,"Preacher curl":103,"Rear-delt fly":60,"Rear-delt machine":60,"Reverse lunge":11,"Reverse pec deck":59,"Romanian deadlift":14,"Rope pressdown":115,"Seated cable row":76,"Seated calf raise":28,"Seated leg curl":17,"Seated row":76,"Seated shoulder press":50,"Single-arm pressdown":116,"Single-leg press":8,"Smith bench press":37,"Smith incline press":38,"Smith squat":4,"Split squat":10,"Standing calf raise":27,"Step-up":13,"Straight-arm pulldown":87,"Suitcase carry":129,"T-bar row":74,"Trap-bar deadlift / deadlift machine":null,"Walking lunge":12,"Wide pulldown":67,"Wide-grip pulldown":67};
</script>
<script>
// ---------- Setup & helpers ----------
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const PHASE_COLOR = {
  "FOUNDATION & CONSISTENCY": {c:"var(--teal)", dim:"var(--teal-dim)", key:"teal"},
  "STRENGTH & MUSCLE": {c:"var(--amber)", dim:"var(--amber-dim)", key:"amber"},
  "BODY COMPOSITION & CONDITIONING": {c:"var(--violet)", dim:"var(--violet-dim)", key:"violet"},
  "FINAL PERFORMANCE & PHYSIQUE": {c:"var(--crimson)", dim:"var(--crimson-dim)", key:"crimson"},
  "MILESTONE REVIEW & TRANSITION": {c:"var(--slate)", dim:"var(--slate-dim)", key:"slate"},
};
const PHASE_ORDER = ["FOUNDATION & CONSISTENCY","STRENGTH & MUSCLE","BODY COMPOSITION & CONDITIONING","FINAL PERFORMANCE & PHYSIQUE","MILESTONE REVIEW & TRANSITION"];

function parseDay(str){ // "01 September 2026"
  const [d, mon, y] = str.split(" ");
  const m = MONTHS.indexOf(mon);
  return new Date(parseInt(y), m, parseInt(d));
}
function iso(dateObj){
  const y = dateObj.getFullYear(), m = String(dateObj.getMonth()+1).padStart(2,"0"), d = String(dateObj.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
function fromISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }

const DAYS_BY_ISO = {};
DAYS.forEach(d => { d._date = parseDay(d.date); d._iso = iso(d._date); DAYS_BY_ISO[d._iso] = d; });
const FIRST_DAY = DAYS[0]._date;
const LAST_DAY = DAYS[DAYS.length-1]._date;
const MILESTONE = new Date(2027,6,10);

function libFor(exerciseName){
  const idx = EXMAP[exerciseName];
  return (idx===null || idx===undefined) ? null : EXLIB[idx];
}
function parseRestSeconds(restStr){
  if (!restStr) return 90;
  const nums = (restStr.match(/[\d.]+/g)||[]).map(Number);
  if (!nums.length) return 90;
  const avg = nums.reduce((a,b)=>a+b,0)/nums.length;
  return /min/i.test(restStr) ? Math.round(avg*60) : Math.round(avg);
}
function formatMMSS(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${String(sec).padStart(2,"0")}`;
}

function clampToRange(d){
  if (d < FIRST_DAY) return new Date(FIRST_DAY);
  if (d > LAST_DAY) return new Date(LAST_DAY);
  return d;
}

let state = {
  view: "today",
  currentISO: null,
  recipeFilter: "All",
  recipeSearch: "",
  trackerScope: "week", // week | month | baseline
  calMode: "month",
  avoidSensitivities: false,
  trackerWeek: null,
  trackerMonth: null,
};
let PREFS = { unit: "kg" };
let timers = {};

(function initDate(){
  const today = new Date();
  const clamped = clampToRange(today);
  // snap to nearest existing day (all days Sep1-Jul31 exist so it's fine)
  state.currentISO = iso(clamped);
  state.trackerWeek = DAYS_BY_ISO[state.currentISO].week;
  const d = DAYS_BY_ISO[state.currentISO]._date;
  state.trackerMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
})();

// ---------- Storage helpers (browser localStorage — works on any host, no backend needed) ----------
const APP_PREFIX = "hpv6:";
function saveKey(key, obj){
  try{
    localStorage.setItem(APP_PREFIX + key, JSON.stringify(obj));
    toast("Saved");
    return true;
  }catch(e){
    console.error("save failed", key, e);
    toast("Save failed \u2014 storage may be full or blocked");
    return null;
  }
}
function loadKey(key){
  try{
    const raw = localStorage.getItem(APP_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
let toastTimer;
function toast(msg){
  const el = document.getElementById("savetoast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 1100);
}
function debounce(fn, ms){
  let t;
  return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}

// ---------- Prefs ----------
async function loadPrefs(){
  const p = loadKey("prefs");
  if (p) Object.assign(PREFS, p);
}
async function savePrefs(){
  saveKey("prefs", PREFS);
}

// ---------- Export ----------
async function exportAllData(){
  const out = {};
  try{
    for (let i=0; i<localStorage.length; i++){
      const rawKey = localStorage.key(i);
      if (!rawKey || !rawKey.startsWith(APP_PREFIX)) continue;
      const shortKey = rawKey.slice(APP_PREFIX.length);
      try{ out[shortKey] = JSON.parse(localStorage.getItem(rawKey)); }
      catch(e){ out[shortKey] = localStorage.getItem(rawKey); }
    }
  }catch(e){ console.error("export failed", e); }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `evans-fitness-export-${iso(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast("Export downloaded");
}

// ---------- Settings sheet ----------
function openSettingsSheet(){
  document.getElementById("unitKg").classList.toggle("active", PREFS.unit==="kg");
  document.getElementById("unitLb").classList.toggle("active", PREFS.unit==="lb");
  const calInput = document.getElementById("calorieTargetInput");
  if (calInput) calInput.value = PREFS.calorieTarget || "";
  const habitsInput = document.getElementById("habitsInput");
  if (habitsInput) habitsInput.value = (PREFS.habits && PREFS.habits.length ? PREFS.habits : ["Water","Supplements","Steps goal","Stretching"]).join(", ");
  document.getElementById("settingsBackdrop").classList.add("show");
}
function closeSettingsSheet(){
  document.getElementById("settingsBackdrop").classList.remove("show");
}
function wireSettingsSheetOnce(){
  document.addEventListener("click", (e)=>{
    if (e.target.closest("#openSettings")) openSettingsSheet();
    if (e.target.id==="settingsBackdrop") closeSettingsSheet();
    if (e.target.closest("#closeSettings")) closeSettingsSheet();
  });
  document.getElementById("unitKg").addEventListener("click", ()=>{ PREFS.unit="kg"; savePrefs(); openSettingsSheet(); render(); });
  document.getElementById("unitLb").addEventListener("click", ()=>{ PREFS.unit="lb"; savePrefs(); openSettingsSheet(); render(); });
  document.getElementById("exportBtn").addEventListener("click", exportAllData);
  document.getElementById("importBtn").addEventListener("click", ()=> document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      Object.entries(data).forEach(([k,v])=>{
        localStorage.setItem(APP_PREFIX + k, JSON.stringify(v));
      });
      toast("Data imported");
      closeSettingsSheet();
      render();
    }catch(err){
      console.error("import failed", err);
      toast("Import failed \u2014 invalid file");
    }
    e.target.value = "";
  });
  const calInput = document.getElementById("calorieTargetInput");
  if (calInput){
    calInput.addEventListener("input", ()=>{
      PREFS.calorieTarget = calInput.value;
      savePrefs();
      updateNutritionTotals();
    });
  }
  const habitsInput = document.getElementById("habitsInput");
  if (habitsInput){
    habitsInput.addEventListener("input", ()=>{
      PREFS.habits = habitsInput.value.split(",").map(s=>s.trim()).filter(Boolean);
      savePrefs();
    });
  }
  const printBtn = document.getElementById("printBtn");
  if (printBtn) printBtn.addEventListener("click", ()=>{ closeSettingsSheet(); setTimeout(()=> window.print(), 200); });
}

// ---------- Render root ----------
const app = document.getElementById("app");

function render(){
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active", b.dataset.view===state.view));
  let html = topbarHTML();
  html += `<main id="main">`;
  if (state.view==="today") html += renderToday();
  else if (state.view==="calendar") html += renderCalendar();
  else if (state.view==="trackers") html += renderTrackers();
  else if (state.view==="recipes") html += renderRecipes();
  else if (state.view==="progress") html += renderProgress();
  html += `</main>`;
  document.getElementById("topbar-slot").outerHTML = `<div id="topbar-slot">${html}</div>`;
  wireView();
}

function topbarHTML(){
  const day = DAYS_BY_ISO[state.currentISO];
  const phase = day ? day.phase : PHASE_ORDER[0];
  const phaseIdx = PHASE_ORDER.indexOf(phase);
  let segs = "";
  PHASE_ORDER.forEach((p,i)=>{
    const cls = i<phaseIdx ? "past" : (i===phaseIdx ? "active" : "future");
    const color = PHASE_COLOR[p].c;
    segs += `<div class="phase-seg ${cls}" style="background:${i<=phaseIdx?color:'var(--line)'}"></div>`;
  });
  const daysToMilestone = Math.round((MILESTONE - day._date)/86400000);
  const milestoneText = daysToMilestone > 0 ? `${daysToMilestone}d to milestone` : (daysToMilestone===0 ? "Milestone day" : `${Math.abs(daysToMilestone)}d past milestone`);
  return `

function parseMacroNum(str){
  const n = parseFloat((str||"").replace(/[^\d.]/g,""));
  return isNaN(n) ? 0 : n;
}
function computeDailyMacros(meals){
  const totals = {energy:0, protein:0, carbs:0, fat:0, fibre:0};
  let matchedCount = 0;
  Object.values(meals||{}).forEach(mealText=>{
    if (!mealText || !mealText.trim()) return;
    const r = matchRecipe(mealText);
    if (!r) return;
    matchedCount++;
    totals.energy += parseMacroNum(r.macros.energy);
    totals.protein += parseMacroNum(r.macros.protein);
    totals.carbs += parseMacroNum(r.macros.carbs);
    totals.fat += parseMacroNum(r.macros.fat);
    totals.fibre += parseMacroNum(r.macros.fibre);
  });
  return {totals, matchedCount};
}
function updateNutritionTotals(){
  const el = document.getElementById("nutritionTotals");
  if (!el) return;
  const loggedMeals = Object.values(todayDraft.meals||{}).filter(m=>m && m.trim());
  if (!loggedMeals.length){
    el.innerHTML = `<div class="empty-state" style="padding:10px 0">Log meals above to see totals here.</div>`;
    return;
  }
  const {totals, matchedCount} = computeDailyMacros(todayDraft.meals);
  if (!matchedCount){
    el.innerHTML = `<div class="empty-state" style="padding:10px 0">Use the recipe autocomplete on your meals to see totals here.</div>`;
    return;
  }
  const target = PREFS.calorieTarget ? parseFloat(PREFS.calorieTarget) : null;
  let bar = "";
  if (target && !isNaN(target)){
    const pct = Math.min(100, Math.round(totals.energy/target*100));
    bar = `<div class="macro-bar"><div class="macro-bar-fill" style="width:${pct}%"></div></div><div class="macro-bar-label">${Math.round(totals.energy)} / ${target} kcal (${pct}%)</div>`;
  }
  el.innerHTML = `
    ${bar}
    <div class="macro-strip" style="margin-top:${target?'10px':'0'}">
      <span><b>${Math.round(totals.energy)}</b> kcal</span>
      <span>P <b>${Math.round(totals.protein)}g</b></span>
      <span>C <b>${Math.round(totals.carbs)}g</b></span>
      <span>F <b>${Math.round(totals.fat)}g</b></span>
      <span>Fibre <b>${Math.round(totals.fibre)}g</b></span>
    </div>
    ${matchedCount<loggedMeals.length ? `<div class="ex-hint" style="margin-top:6px">${matchedCount} of ${loggedMeals.length} logged meals matched to a recipe</div>` : ""}
  `;
}

function exerciseMaxLoad(v){
  if (!v || !v.loads) return 0;
  const nums = v.loads.map(x=>parseFloat(x)).filter(x=>!isNaN(x));
  return nums.length ? Math.max(...nums) : 0;
}

function updateSessionVolume(){
  const day = DAYS_BY_ISO[state.currentISO];
  const volEl = document.getElementById("sessionVolume");
  if (!volEl || !day.workout) return;
  let total = 0;
  day.workout.exercises.forEach((e,i)=>{
    const v = todayDraft.ex[i];
    if (!v || !v.loads) return;
    v.loads.forEach((w,s)=>{
      const wNum = parseFloat(w), rNum = parseFloat((v.reps||[])[s]);
      if (!isNaN(wNum) && !isNaN(rNum)) total += wNum*rNum;
    });
  });
  volEl.textContent = total > 0 ? `Session volume: ${Math.round(total).toLocaleString()}${PREFS.unit}` : "";
}

async function saveTodayForm(){
  const key = `log-${state.currentISO}`;
  saveKey(key, todayDraft);
  // update last-performance + personal-record caches
  const day = DAYS_BY_ISO[state.currentISO];
  if (day.workout){
    const lastperf = loadKey("lastperf") || {};
    const bestperf = loadKey("bestperf") || {};
    let changed = false, bestChanged = false;
    day.workout.exercises.forEach((e,i)=>{
      const v = todayDraft.ex[i];
      if (v && v.loads && v.loads.some(x=>x)){
        lastperf[e.exercise] = { date: state.currentISO, loads: v.loads, reps: v.reps||["","","",""], notes: v.notes||"" };
        changed = true;
        const todayMax = exerciseMaxLoad(v);
        const prevBest = bestperf[e.exercise] ? bestperf[e.exercise].maxLoad : 0;
        if (todayMax > prevBest){
          bestperf[e.exercise] = { maxLoad: todayMax, date: state.currentISO };
          bestChanged = true;
        }
      }
    });
    if (changed) saveKey("lastperf", lastperf);
    if (bestChanged) saveKey("bestperf", bestperf);
  }
}
let todaySaveTimer = null;
function scheduleTodaySave(){
  clearTimeout(todaySaveTimer);
  todaySaveTimer = setTimeout(saveTodayForm, 500);
}
function flushTodaySave(){
  clearTimeout(todaySaveTimer);
  todaySaveTimer = null;
  saveTodayForm();
}

// ---------- Rest timer ----------
let audioCtx;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    o.start();
    o.stop(audioCtx.currentTime + 0.28);
  }catch(e){}
  if (navigator.vibrate) navigator.vibrate([150,80,150]);
}
function toggleRestTimer(btn){
  const idx = btn.dataset.idx;
  if (timers[idx]){
    clearInterval(timers[idx]);
    delete timers[idx];
    btn.classList.remove("running");
    btn.innerHTML = `&#9201; ${formatMMSS(parseInt(btn.dataset.base))}`;
    return;
  }
  let remaining = parseInt(btn.dataset.base);
  btn.classList.add("running");
  btn.innerHTML = `&#9201; ${formatMMSS(remaining)}`;
  timers[idx] = setInterval(()=>{
    remaining -= 1;
    if (remaining <= 0){
      clearInterval(timers[idx]);
      delete timers[idx];
      btn.classList.remove("running");
      btn.innerHTML = `&#9201; ${formatMMSS(parseInt(btn.dataset.base))}`;
      beep();
      return;
    }
    btn.innerHTML = `&#9201; ${formatMMSS(remaining)}`;
  }, 1000);
}

// ---------- CALENDAR VIEW ----------
function monthKeyList(){
  const keys = [];
  let cur = new Date(FIRST_DAY.getFullYear(), FIRST_DAY.getMonth(), 1);
  const end = new Date(LAST_DAY.getFullYear(), LAST_DAY.getMonth(), 1);
  while (cur <= end){
    keys.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}`);
    cur.setMonth(cur.getMonth()+1);
  }
  return keys;
}
let calActiveMonth = null;
function renderCalendar(){
  const day = DAYS_BY_ISO[state.currentISO];
  if (!calActiveMonth){
    calActiveMonth = `${day._date.getFullYear()}-${String(day._date.getMonth()+1).padStart(2,"0")}`;
  }

  let html = `<div class="filter-row">
    <div class="filter-chip ${state.calMode==='month'?'active':''}" data-calmode="month">Month</div>
    <div class="filter-chip ${state.calMode==='week'?'active':''}" data-calmode="week">Week</div>
  </div>`;

  if (state.calMode==="week"){
    html += renderWeekAtAGlance();
    return html;
  }

  const months = monthKeyList();
  let chips = "";
  months.forEach(mk=>{
    const [y,m] = mk.split("-").map(Number);
    chips += `<div class="month-chip ${mk===calActiveMonth?'active':''}" data-mk="${mk}">${MONTHS[m-1].slice(0,3)} ${y}</div>`;
  });

  const [y,m] = calActiveMonth.split("-").map(Number);
  const firstOfMonth = new Date(y, m-1, 1);
  const startDow = firstOfMonth.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();

  let cells = "";
  ["S","M","T","W","T","F","S"].forEach(d=> cells += `<div class="dow">${d}</div>`);
  for (let i=0;i<startDow;i++) cells += `<div class="calcell empty"></div>`;
  for (let dnum=1; dnum<=daysInMonth; dnum++){
    const dObj = new Date(y, m-1, dnum);
    const dISO = iso(dObj);
    const dEntry = DAYS_BY_ISO[dISO];
    if (!dEntry){ cells += `<div class="calcell empty"></div>`; continue; }
    const color = PHASE_COLOR[dEntry.phase].c;
    const isToday = dISO===state.currentISO;
    cells += `<div class="calcell ${isToday?'today':''}" data-iso="${dISO}">
      <div class="n">${dnum}</div>
      <div class="tag" style="background:${color}"></div>
    </div>`;
  }

  html += `
    <div class="month-select" id="monthSelect">${chips}</div>
    <div class="calgrid">${cells}</div>
  `;
  return html;
}

function dayHasAnyData(d){
  const log = loadKey(`log-${d._iso}`);
  if (!log) return false;
  const exLogged = log.ex && Object.values(log.ex).some(v=>v.loads && v.loads.some(x=>x));
  const mealsLogged = log.meals && Object.values(log.meals).some(v=>v);
  return !!(exLogged || mealsLogged || log.recoveryNotes || log.bodyweight);
}

function renderWeekAtAGlance(){
  const day = DAYS_BY_ISO[state.currentISO];
  const weekNum = day.week;
  const daysInWeek = DAYS.filter(d=>d.week===weekNum);
  let html = `<div class="section-divider" style="margin-top:0">Week ${weekNum} &middot; ${weekDateRange(weekNum)}</div><div class="week-list">`;
  daysInWeek.forEach(d=>{
    const hasData = dayHasAnyData(d);
    const label = d.workout ? d.workout.rotation : (d.recovery_activity ? "Recovery / Activity" : "Rest / Review");
    const color = PHASE_COLOR[d.phase].c;
    html += `<div class="week-day-card ${d._iso===state.currentISO?'today':''}" data-iso="${d._iso}">

        <div class="week-day-type">${label}</div>
      </div>
      ${hasData ? '<div class="week-day-check">&#10003;</div>' : ''}
    </div>`;
  });
  html += `</div>`;
  return html;
}

function weekList(){
  const s = new Set();
  DAYS.forEach(d=>s.add(d.week));
  return Array.from(s).sort((a,b)=>parseInt(a)-parseInt(b));
}
function weekDateRange(weekNum){
  const daysInWeek = DAYS.filter(d=>d.week===weekNum);
  if (!daysInWeek.length) return "";
  const first = daysInWeek[0]._date, last = daysInWeek[daysInWeek.length-1]._date;
  return `${first.getDate()} ${MONTHS[first.getMonth()].slice(0,3)} \u2013 ${last.getDate()} ${MONTHS[last.getMonth()].slice(0,3)}`;
}

function photoStoreKey(){

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if (w>h){ if (w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if (h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function loadPhotosIntoSlots(){
  const data = loadKey(photoStoreKey()) || {};
  ["front","side","back"].forEach(slot=>{
    const thumb = document.getElementById(`photoThumb-${slot}`);
    if (thumb && data[slot]) thumb.innerHTML = `<img src="${data[slot]}" alt="${slot} progress photo">`;
  });
}
function wirePhotoSlots(){
  ["front","side","back"].forEach(slot=>{
    const thumb = document.getElementById(`photoThumb-${slot}`);
    const fileInput = document.getElementById(`photoFile-${slot}`);
    if (!thumb || !fileInput) return;
    thumb.addEventListener("click", ()=> fileInput.click());
    fileInput.addEventListener("change", async ()=>{
      const file = fileInput.files[0];
      if (!file) return;
      try{
        const dataUrl = await resizeImageFile(file, 480, 0.72);
        const key = photoStoreKey();
        const data = loadKey(key) || {};
        data[slot] = dataUrl;
        saveKey(key, data);
        thumb.innerHTML = `<img src="${dataUrl}" alt="${slot} progress photo">`;
      }catch(e){ console.error("photo save failed", e); toast("Photo save failed"); }
      fileInput.value = "";
    });
  });
}

function matchRecipe(text){
  const t = text.toLowerCase().trim();
  if (!t) return null;
  let found = RECIPES.find(r=>r.title.toLowerCase()===t);
  if (found) return found;
  found = RECIPES.find(r=> t.includes(r.title.toLowerCase()));
  return found || null;
}
async function generateShoppingList(){
  const resultEl = document.getElementById("shopResult");
  resultEl.innerHTML = `<div class="empty-state" style="padding:14px 0">Gathering this week's meals&hellip;</div>`;
  const weekNum = state.trackerWeek;
  const daysInWeek = DAYS.filter(d=>d.week===weekNum);
  const counts = {};
  const unmatched = [];
  const customItems = [];
  for (const d of daysInWeek){
    const log = loadKey(`log-${d._iso}`);
    if (!log) continue;
    if (log.meals){
      Object.values(log.meals).forEach(mealText=>{
        if (!mealText || !mealText.trim()) return;
        const m = matchRecipe(mealText);
        if (m) counts[m.title] = (counts[m.title]||0)+1;
        else unmatched.push(mealText.trim());
      });
    }
    if (log.customIngredients && log.customIngredients.trim()){
      log.customIngredients.split("\n").forEach(line=>{
        const t = line.trim();
        if (t) customItems.push(t);
      });
    }
  }
  const titles = Object.keys(counts);
  if (!titles.length && !unmatched.length && !customItems.length){
    resultEl.innerHTML = `<div class="empty-state" style="padding:14px 0"><div class="big">No meals logged</div>Fill in meals on Today for this week's days first.</div>`;
    return;
  }
  let html = "";
  titles.forEach(title=>{
    const r = RECIPES.find(rr=>rr.title===title);
    html += `<div class="section-divider" style="margin-top:14px">${title}${counts[title]>1?` &times;${counts[title]}`:""}</div><ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-dim)">`;
    r.ingredients.forEach(ing=> html += `<li>${ing}</li>`);
    html += `</ul>`;
  });
  if (customItems.length){
    html += `<div class="section-divider" style="margin-top:14px">Your own meals / ingredients</div><ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-dim)">`;
    customItems.forEach(item=> html += `<li>${item}</li>`);
    html += `</ul>`;
  }
  if (unmatched.length){
    html += `<div class="section-divider" style="margin-top:14px">Logged but not matched to a recipe</div><ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-faint)">`;
    unmatched.forEach(u=> html += `<li>${u}</li>`);
    html += `</ul>`;
  }
  resultEl.innerHTML = html;
}

function getWeeklyFieldPoints(fieldKey, parser=parseFloat){
  const pts = [];
  weekList().forEach(w=>{

    if (data && data[fieldKey]!==undefined && data[fieldKey]!==""){
      const v = parser(data[fieldKey]);
      if (!isNaN(v)) pts.push({label:`W${w}`, v});
    }
  });
  return pts;
}
function weeklyMultiSeries(fieldKeys, parser=parseFloat){
  const weeks = weekList();
  const relevant = weeks.filter(w=>{
    const data = loadKey(`week-${String(w).padStart(2,"0")}`);
    return data && fieldKeys.some(fk=> data[fk]!==undefined && data[fk]!=="");
  });
  const labels = relevant.map(w=>`W${w}`);
  const series = {};
  fieldKeys.forEach(fk=>{
    series[fk] = relevant.map(w=>{
      const data = loadKey(`week-${String(w).padStart(2,"0")}`);
      const raw = data ? data[fk] : undefined;
      if (raw===undefined || raw==="") return null;
      const v = parser(raw);
      return isNaN(v) ? null : v;
    });
  });
  return {labels, series};
}
function monthlyMultiSeries(fieldKeys, parser=parseFloat){
  const months = monthKeyList();
  const relevant = months.filter(mk=>{
    const data = loadKey(`month-${mk}`);
    return data && fieldKeys.some(fk=> data[fk]!==undefined && data[fk]!=="");
  });
  const labels = relevant.map(mk=>{ const [y,m]=mk.split("-"); return MONTHS[parseInt(m)-1].slice(0,3); });
  const series = {};
  fieldKeys.forEach(fk=>{
    series[fk] = relevant.map(mk=>{
      const data = loadKey(`month-${mk}`);
      const raw = data ? data[fk] : undefined;
      if (raw===undefined || raw==="") return null;
      const v = parser(raw);
      return isNaN(v) ? null : v;
    });
  });
  return {labels, series};
}
function getCombinedWeightPoints(){
  const points = [];
  DAYS.forEach(d=>{
    const log = loadKey(`log-${d._iso}`);
    if (log && log.bodyweight && !isNaN(parseFloat(log.bodyweight))){
      points.push({date:d._iso, v:parseFloat(log.bodyweight)});
    }
  });
  weekList().forEach(w=>{
    const data = loadKey(`week-${String(w).padStart(2,"0")}`);
    if (data && data.bodyweight && !isNaN(parseFloat(data.bodyweight))){
      const daysInWeek = DAYS.filter(dd=>dd.week===w);
      if (daysInWeek.length){
        const dt = daysInWeek[daysInWeek.length-1]._iso;
        if (!points.find(p=>p.date===dt)) points.push({date:dt, v:parseFloat(data.bodyweight)});
      }
    }
  });
  monthKeyList().forEach(mk=>{
    const data = loadKey(`month-${mk}`);
    if (data && data.bodyweight && !isNaN(parseFloat(data.bodyweight))){
      const [y,m] = mk.split("-").map(Number);
      const lastDayNum = new Date(y,m,0).getDate();
      const dt = iso(new Date(y,m-1,lastDayNum));
      if (DAYS_BY_ISO[dt] && !points.find(p=>p.date===dt)) points.push({date:dt, v:parseFloat(data.bodyweight)});
    }
  });
  points.sort((a,b)=> a.date.localeCompare(b.date));
  return points.map(p=>{ const d=fromISO(p.date); return {label:`${d.getDate()}/${d.getMonth()+1}`, v:p.v}; });
}
function allExerciseNames(){
  const set = new Set();

function getExerciseHistory(exerciseName){
  const points = [];
  DAYS.forEach(d=>{
    if (!d.workout) return;
    const idx = d.workout.exercises.findIndex(ex=>ex.exercise===exerciseName);

// ---------- Streaks & badges ----------
function computeStreak(){
  const todayClamped = clampToRange(new Date());
  const todayIdx = DAYS.findIndex(d=>d._iso===iso(todayClamped));
  let streak = 0;
  for (let i=todayIdx; i>=0; i--){
    const d = DAYS[i];
    if (!d.workout) continue;
    const log = loadKey(`log-${d._iso}`);
    const hasData = log && log.ex && Object.values(log.ex).some(v=>v.loads && v.loads.some(x=>x));
    if (hasData) streak++;
    else break;
  }
  return streak;
}
function totalSessionsLogged(){
  let count = 0;
  DAYS.forEach(d=>{
    if (!d.workout) return;
    const log = loadKey(`log-${d._iso}`);
    if (log && log.ex && Object.values(log.ex).some(v=>v.loads && v.loads.some(x=>x))) count++;
  });
  return count;
}

        { label:"Energy", data: wellness.series.energy, borderColor:"#C97A3D", tension:0.3, pointRadius:2, spanGaps:true },
        { label:"Nutrition", data: wellness.series.nutrition, borderColor:"#8C3040", tension:0.3, pointRadius:2, spanGaps:true }
      ]},
      options: chartOpts(5, true)
    });
  }, "Rate sleep, energy and nutrition (1\u20135) in your weekly tracker.");

  const cons = monthlyMultiSeries(["consistency"], parseInt);
  renderChartOrEmpty("consistencyChart", cons.series.consistency.some(v=>v!==null), ()=>{
    new Chart(document.getElementById("consistencyChart"), {
      type:"line",
      data:{ labels: cons.labels, datasets:[{ data: cons.series.consistency, borderColor:"#E87A3D", backgroundColor:"rgba(232,122,61,0.12)", fill:true, tension:0.3, pointRadius:3, spanGaps:true }] },
      options: chartOpts(5)
    });
  }, "Rate overall consistency (1\u20135) in your monthly tracker.");

  const v1 = weeklyMultiSeries(["shRHR","shStress"], parseFloat);
  const v1has = ["shRHR","shStress"].some(k=> v1.series[k].some(v=>v!==null));
  renderChartOrEmpty("vitalsChart1", v1has, ()=>{
    new Chart(document.getElementById("vitalsChart1"), {
      type:"line",
      data:{ labels: v1.labels, datasets:[
        { label:"Resting HR", data: v1.series.shRHR, borderColor:"#E87A3D", tension:0.3, pointRadius:2, spanGaps:true },
        { label:"Stress", data: v1.series.shStress, borderColor:"#8A6E5C", tension:0.3, pointRadius:2, spanGaps:true }
      ]},
      options: chartOpts(undefined, true)
    });
  }, "Log resting heart rate and stress score from Samsung Health in your weekly tracker.");

  const v2 = weeklyMultiSeries(["shSleep","shSteps"], parseFloat);
  const v2has = ["shSleep","shSteps"].some(k=> v2.series[k].some(v=>v!==null));
  renderChartOrEmpty("vitalsChart2", v2has, ()=>{
    const stepsK = v2.series.shSteps.map(v=> v===null?null: v/1000);
    new Chart(document.getElementById("vitalsChart2"), {
      type:"line",
      data:{ labels: v2.labels, datasets:[
        { label:"Sleep (hrs)", data: v2.series.shSleep, borderColor:"#E24A42", tension:0.3, pointRadius:2, spanGaps:true },
        { label:"Steps (000s)", data: stepsK, borderColor:"#C97A3D", tension:0.3, pointRadius:2, spanGaps:true }
      ]},
      options: chartOpts(undefined, true)
    });
  }, "Log sleep hours and step count from Samsung Health in your weekly tracker.");

  const meas = monthlyMultiSeries(["chest","waist","hips","arms","thighs"], parseFloat);
  const measHas = ["chest","waist","hips","arms","thighs"].some(k=> meas.series[k].some(v=>v!==null));
  renderChartOrEmpty("measureChart", measHas, ()=>{
    new Chart(document.getElementById("measureChart"), {
      type:"line",
      data:{ labels: meas.labels, datasets:[
        { label:"Chest", data: meas.series.chest, borderColor:"#E24A42", tension:0.3, pointRadius:2, spanGaps:true },
        { label:"Waist", data: meas.series.waist, borderColor:"#C97A3D", tension:0.3, pointRadius:2, spanGaps:true },
        { label:"Hips", data: meas.series.hips, borderColor:"#8C3040", tension:0.3, pointRadius:2, spanGaps:true },
        { label:"Arms", data: meas.series.arms, borderColor:"#E87A3D", tension:0.3, pointRadius:2, spanGaps:true },
        { label:"Thighs", data: meas.series.thighs, borderColor:"#8A6E5C", tension:0.3, pointRadius:2, spanGaps:true }
      ]},
      options: chartOpts(undefined, true)
    });
  }, "Log chest / waist / hips / arms / thighs in your monthly tracker.");

  const exSelect = document.getElementById("exerciseSelect");
  if (exSelect) exSelect.addEventListener("change", ()=> drawExerciseChart(exSelect.value));
  drawExerciseChart("");
}

let exerciseChartInstance = null;
function drawExerciseChart(exerciseName){
  const canvas = document.getElementById("exerciseChart");
  if (!canvas) return;
  if (exerciseChartInstance){ exerciseChartInstance.destroy(); exerciseChartInstance = null; }
  const existingEmpty = canvas.parentElement.querySelector(".empty-state");
  if (existingEmpty) existingEmpty.remove();
  canvas.style.display = "";
  if (!exerciseName){
    canvas.style.display = "none";
    canvas.parentElement.insertAdjacentHTML("beforeend", `<div class="empty-state" style="padding:20px 0"><div class="big">Pick an exercise</div>Choose one above to see your strength progress over time.</div>`);
    return;
  }
  const points = getExerciseHistory(exerciseName);
  if (!points.length){
    canvas.style.display = "none";
    canvas.parentElement.insertAdjacentHTML("beforeend", `<div class="empty-state" style="padding:20px 0"><div class="big">No logs yet</div>Log a weight for this exercise to see it here.</div>`);
    return;
  }
  exerciseChartInstance = new Chart(canvas, {
    type:"line",
    data:{ labels: points.map(p=>p.label), datasets:[{ data: points.map(p=>p.v), borderColor:"#E24A42", backgroundColor:"rgba(226,74,66,0.12)", fill:true, tension:0.3, pointRadius:3, pointBackgroundColor:"#E24A42" }] },
    options: chartOpts()
  });
}

function chartOpts(maxY, showLegend){
  return {
    responsive:true,
    plugins:{legend:{display:!!showLegend, labels:{color:"#B0A29D", font:{family:"JetBrains Mono", size:9}}}},
    scales:{
      x:{ ticks:{color:"#B0A29D", font:{family:"JetBrains Mono", size:9}}, grid:{color:"#3A302E"} },
      y:{ ticks:{color:"#B0A29D", font:{family:"JetBrains Mono", size:9}}, grid:{color:"#3A302E"}, suggestedMax:maxY }
    }
  };
}

// ---------- Wiring ----------
let trackerDraft = {};

function wireView(){
  if (state.view==="today"){
    document.getElementById("prevDay").onclick = ()=>{ flushTodaySave(); shiftDay(-1); };
    document.getElementById("nextDay").onclick = ()=>{ flushTodaySave(); shiftDay(1); };
    document.getElementById("openCalFromToday").onclick = ()=>{ flushTodaySave(); state.view="calendar"; calActiveMonth=null; render(); };
    document.querySelectorAll(".ex-input").forEach(el=> el.addEventListener("input", ()=>{
      const idx = el.dataset.idx, setN = el.dataset.set;
      todayDraft.ex[idx] = todayDraft.ex[idx] || { loads:["","","",""], reps:["","","",""], notes:"" };
      todayDraft.ex[idx].loads[setN] = el.value;
      updateSessionVolume();
      scheduleTodaySave();
    }));
    document.querySelectorAll(".ex-reps").forEach(el=> el.addEventListener("input", ()=>{
      const idx = el.dataset.idx, setN = el.dataset.set;
      todayDraft.ex[idx] = todayDraft.ex[idx] || { loads:["","","",""], reps:["","","",""], notes:"" };
      todayDraft.ex[idx].reps[setN] = el.value;
      updateSessionVolume();
      scheduleTodaySave();
    }));
    document.querySelectorAll(".ex-notes").forEach(el=> el.addEventListener("input", ()=>{
      const idx = el.dataset.idx;
      todayDraft.ex[idx] = todayDraft.ex[idx] || { loads:["","","",""], reps:["","","",""], notes:"" };
      todayDraft.ex[idx].notes = el.value;
      scheduleTodaySave();
    }));
    document.querySelectorAll(".meal-input").forEach(el=> el.addEventListener("input", ()=>{
      todayDraft.meals[el.dataset.meal] = el.value;
      updateNutritionTotals();
      scheduleTodaySave();
    }));
    const ci = document.getElementById("customIngredients");
    if (ci) ci.addEventListener("input", ()=>{ todayDraft.customIngredients = ci.value; scheduleTodaySave(); });
    const rn = document.getElementById("recoveryNotes");
    if (rn) rn.addEventListener("input", ()=>{ todayDraft.recoveryNotes = rn.value; scheduleTodaySave(); });
    const qw = document.getElementById("quickWeight");
    if (qw) qw.addEventListener("input", ()=>{ todayDraft.bodyweight = qw.value; scheduleTodaySave(); });
    document.querySelectorAll(".habit-check").forEach(el=> el.addEventListener("change", ()=>{
      todayDraft.habits = todayDraft.habits || {};
      todayDraft.habits[el.dataset.habit] = el.checked;
      scheduleTodaySave();
    }));
    document.querySelectorAll(".warmup-check").forEach(el=> el.addEventListener("change", ()=>{
      todayDraft.warmup = todayDraft.warmup || {};
      todayDraft.warmup[el.dataset.step] = el.checked;
      scheduleTodaySave();
    }));
    document.querySelectorAll(".tech-toggle").forEach(t=>{
      t.addEventListener("click", ()=>{
        document.getElementById(`tech-${t.dataset.idx}`).classList.toggle("open");
      });
    });
    document.querySelectorAll(".rest-btn").forEach(btn=> btn.addEventListener("click", ()=> toggleRestTimer(btn)));
    loadTodayIntoForm();
  } else if (state.view==="calendar"){
    document.querySelectorAll(".filter-chip[data-calmode]").forEach(c=> c.onclick = ()=>{ state.calMode = c.dataset.calmode; render(); });
    document.querySelectorAll(".month-chip").forEach(c=> c.onclick = ()=>{ calActiveMonth = c.dataset.mk; render(); });
    document.querySelectorAll(".calcell[data-iso]").forEach(c=> c.onclick = ()=>{ state.currentISO = c.dataset.iso; state.view="today"; render(); });
    document.querySelectorAll(".week-day-card[data-iso]").forEach(c=> c.onclick = ()=>{ state.currentISO = c.dataset.iso; state.view="today"; render(); });
  } else if (state.view==="trackers"){
    document.querySelectorAll(".filter-chip[data-scope]").forEach(c=> c.onclick = ()=>{ flushTrackerSave(); state.trackerScope = c.dataset.scope; render(); });
    const ws = document.getElementById("weekSelect");
    if (ws) ws.onchange = ()=>{ flushTrackerSave(); state.trackerWeek = ws.value; render(); };
    const ms = document.getElementById("monthSelect2");
    if (ms) ms.onchange = ()=>{ flushTrackerSave(); state.trackerMonth = ms.value; render(); };
    document.querySelectorAll('#main input[type=text][data-key], #main textarea[data-key]').forEach(el=> el.addEventListener("input", ()=>{
      trackerDraft[el.dataset.key] = el.value;
      scheduleTrackerSave();
    }));
    document.querySelectorAll(".scale-btn").forEach(btn=>{
      btn.onclick = ()=>{
        document.querySelectorAll(`.scale-btn[data-key="${btn.dataset.key}"]`).forEach(b=> b.classList.remove("sel"));
        btn.classList.add("sel");
        trackerDraft[btn.dataset.key] = btn.dataset.val;
        flushTrackerSave();
      };
    });
    const shopBtn = document.getElementById("genShopBtn");
    if (shopBtn) shopBtn.addEventListener("click", generateShoppingList);
    wirePhotoSlots();
    loadPhotosIntoSlots();
    loadTrackerForm();
  } else if (state.view==="recipes"){
    const search = document.getElementById("recipeSearch");
    search.oninput = debounce(()=>{ state.recipeSearch = search.value; render(); document.getElementById("recipeSearch").focus(); }, 300);
    document.querySelectorAll(".filter-chip[data-filter]").forEach(c=> c.onclick = ()=>{ state.recipeFilter = c.dataset.filter; render(); });
    const avoidToggle = document.getElementById("avoidSensToggle");
    if (avoidToggle) avoidToggle.addEventListener("change", ()=>{ state.avoidSensitivities = avoidToggle.checked; render(); });
    document.querySelectorAll(".recipe-card").forEach(card=>{
      card.addEventListener("click", (e)=>{ card.classList.toggle("open"); }, {capture:false});
    });
  } else if (state.view==="progress"){
    drawProgressCharts();
  }
}

function shiftDay(delta){
  const cur = fromISO(state.currentISO);
  cur.setDate(cur.getDate()+delta);
  const clamped = clampToRange(cur);
  const clampedISO = iso(clamped);
  if (DAYS_BY_ISO[clampedISO]) state.currentISO = clampedISO;
  render();
}

document.querySelectorAll(".navbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    if (state.view==="today") flushTodaySave();
    if (state.view==="trackers") flushTrackerSave();
    state.view = btn.dataset.view;
    render();
  });
});

(async function start(){
  await loadPrefs();
  wireSettingsSheetOnce();
  render();
  if ('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(e=> console.error('SW registration failed', e));
    });
  }
})();

</script>
