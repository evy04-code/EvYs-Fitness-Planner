<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#141110;
  --surface:#1E1917;
  --surface-2:#282120;
  --line:#3A302E;
  --text:#F1EBE8;
  --text-dim:#B0A29D;
  --text-faint:#71615D;
  --amber:#E24A42;
  --amber-dim:#3B1E1C;
  --teal:#C97A3D;
  --teal-dim:#33221A;
  --violet:#8C3040;
  --violet-dim:#2E1519;
  --crimson:#E87A3D;
  --crimson-dim:#3A2418;
  --slate:#8A6E5C;
  --slate-dim:#2C231D;
  --good:#C97A3D;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
body{padding-bottom:78px;min-height:100vh;}
h1,h2,h3,.display{font-family:var(--font-display);letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);}
::selection{background:var(--amber);color:#141110;}
a{color:inherit;}
button{font-family:inherit;}
input,textarea{font-family:inherit;}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(18,21,26,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px 10px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:0.02em;color:var(--amber);text-transform:uppercase;}
.milestone-chip{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);border:1px solid var(--line);padding:3px 8px;border-radius:20px;white-space:nowrap;}

/* Phase strip / signature element */
.phase-strip{display:flex;gap:3px;margin-top:12px;height:5px;border-radius:3px;overflow:hidden;}
.phase-seg{flex:1;background:var(--line);position:relative;}
.phase-seg.active{filter:brightness(1);}
.phase-seg.past{opacity:0.35;}
.phase-seg.future{opacity:0.18;}

.phase-label-row{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-dim);}
.phase-name{font-family:var(--font-display);font-weight:600;font-size:13px;}

/* Date nav */
.datenav{display:flex;align-items:center;gap:10px;margin-top:14px;}
.datenav button.arrow{background:var(--surface);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.datenav button.arrow:active{background:var(--surface-2);}
.datenav .datepick{flex:1;text-align:center;cursor:pointer;}
.datenav .weekday{font-family:var(--font-display);font-weight:700;font-size:19px;}
.datenav .fulldate{font-size:11px;color:var(--text-dim);margin-top:1px;}
.datenav .weeklabel{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin-top:2px;}
.quickweight-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.quickweight-label{font-size:12.5px;color:var(--text-dim);}
.quickweight-input{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--amber);font-family:var(--font-mono);font-weight:600;font-size:14px;padding:8px 12px;width:90px;text-align:center;}
.quickweight-input:focus{outline:none;border-color:var(--amber);}

/* Main content */
main{padding:16px;max-width:640px;margin:0 auto;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
.card-title{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:12px;}
.card-title .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);}

/* Schedule timeline */
.timeline{display:flex;flex-direction:column;}
.tl-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);}
.tl-row:last-child{border-bottom:none;}
.tl-time{font-family:var(--font-mono);font-size:12px;color:var(--amber);width:78px;flex-shrink:0;padding-top:1px;}
.tl-plan{font-size:13.5px;color:var(--text);line-height:1.45;}

/* Workout table */
.workout-meta{font-size:11.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.5;}
.ex-row{display:block;padding:12px 0;border-bottom:1px solid var(--line);}
.ex-row:last-child{border-bottom:none;}
.ex-name{font-size:13.5px;font-weight:500;}
.ex-target{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:2px;}
.ex-actions{display:flex;gap:12px;margin-top:5px;flex-wrap:wrap;}
.ex-link{color:var(--amber);text-decoration:none;font-size:11px;cursor:pointer;user-select:none;}
.ex-link:active{opacity:0.7;}
.rest-btn{color:var(--teal);font-family:var(--font-mono);}
.rest-btn.running{color:var(--crimson);}
.ex-hint{font-size:10.5px;color:var(--text-faint);margin-top:4px;font-family:var(--font-mono);min-height:13px;}
.tech-panel{display:none;background:var(--surface-2);border-radius:10px;padding:12px;margin-top:10px;font-size:12px;line-height:1.55;color:var(--text-dim);}
.tech-panel.open{display:block;}
.tech-panel b{color:var(--text);}
.tech-panel p{margin:0 0 8px;}
.tech-panel ul{margin:0 0 8px;padding-left:16px;}
.tech-panel li{margin-bottom:3px;}
.set-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px;}
.set-box{display:flex;flex-direction:column;gap:4px;align-items:center;width:100%;}
.set-box label{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.03em;}
.set-inputs{display:flex;flex-direction:column;width:100%;}
.ex-input{background:var(--surface-2);border:1px solid var(--line);border-radius:8px 8px 0 0;color:var(--text);font-family:var(--font-mono);font-size:13px;padding:9px 4px 6px;text-align:center;width:100%;border-bottom:none;}
.ex-input:focus{outline:none;border-color:var(--amber);}
.ex-reps{background:var(--surface-2);border:1px solid var(--line);border-radius:0 0 8px 8px;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;padding:5px 4px 7px;text-align:center;width:100%;}
.ex-reps:focus{outline:none;border-color:var(--teal);}
.ex-reps::placeholder,.ex-input::placeholder{color:var(--text-faint);}
.ex-notes{width:100%;background:transparent;border:none;border-bottom:1px dashed var(--line);color:var(--text-dim);font-size:12px;padding:8px 0 4px;margin-top:8px;}
.ex-notes:focus{outline:none;border-color:var(--amber);}
.ex-notes::placeholder{color:var(--text-faint);}

/* Meals */
.meal-row{display:flex;gap:10px;align-items:center;padding:8px 0;}
.meal-label{width:64px;flex-shrink:0;font-size:12px;color:var(--text-dim);font-family:var(--font-mono);}
.meal-input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:13px;padding:9px 10px;}
.meal-input:focus{outline:none;border-color:var(--amber);}
.custom-ingredients-block{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.custom-ingredients-block label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:6px;font-family:var(--font-mono);line-height:1.4;}
.custom-ingredients-block textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:13px;padding:9px 10px;min-height:70px;resize:vertical;font-family:var(--font-mono);}
.custom-ingredients-block textarea:focus{outline:none;border-color:var(--amber);}

/* Recovery badge */
.recovery-badge{display:inline-flex;align-items:center;gap:6px;background:var(--teal-dim);color:var(--teal);padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:10px;}

/* Bottom nav */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,21,26,0.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;background:none;border:none;color:var(--text-faint);font-size:10px;font-family:var(--font-body);}
.navbtn svg{width:20px;height:20px;stroke:var(--text-faint);fill:none;stroke-width:1.7;}
.navbtn.active{color:var(--amber);}
.navbtn.active svg{stroke:var(--amber);}

/* Save toast */
.savetoast{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-40px);background:var(--teal);color:#241407;font-size:11.5px;font-weight:700;padding:7px 14px;border-radius:20px;z-index:100;transition:transform 0.25s ease,opacity 0.25s ease;opacity:0;pointer-events:none;}
.savetoast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* Calendar view */
.month-select{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none;}
.month-select::-webkit-scrollbar{display:none;}
.month-chip{flex-shrink:0;font-family:var(--font-mono);font-size:11px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);color:var(--text-dim);white-space:nowrap;}
.month-chip.active{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.calgrid .dow{font-size:9.5px;color:var(--text-faint);text-align:center;padding-bottom:4px;font-family:var(--font-mono);}
.calcell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;font-size:12px;position:relative;background:var(--surface);border:1px solid var(--line);}
.calcell.empty{background:none;border:none;}
.calcell .n{font-family:var(--font-mono);font-weight:600;}
.calcell .tag{width:4px;height:4px;border-radius:50%;margin-top:3px;}
.calcell.today{border-color:var(--amber);}
.calcell.logged .n{color:var(--teal);}
.week-list{display:flex;flex-direction:column;gap:8px;}
.week-day-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.week-day-card.today{border-color:var(--amber);}
.week-day-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.week-day-info{flex:1;}
.week-day-name{font-family:var(--font-display);font-weight:600;font-size:13.5px;}
.week-day-date{font-family:var(--font-mono);font-weight:400;color:var(--text-dim);font-size:11px;margin-left:6px;}
.week-day-type{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.week-day-check{color:var(--teal);font-weight:700;font-size:15px;}

/* Recipe list */
.search-bar{display:flex;gap:8px;margin-bottom:12px;}
.search-input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 14px;font-size:13.5px;}
.search-input:focus{outline:none;border-color:var(--amber);}
.filter-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0;font-size:11.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--text-dim);white-space:nowrap;}
.filter-chip.active{background:var(--amber);border-color:var(--amber);color:#1D0D0B;font-weight:700;}
.recipe-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.recipe-title{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:3px;}
.recipe-sub{font-size:11.5px;color:var(--text-dim);margin-bottom:10px;line-height:1.4;}
.sens-badge{font-size:10.5px;padding:5px 9px;border-radius:8px;margin-bottom:8px;display:inline-block;}
.sens-badge.sens-high{background:var(--amber-dim);color:var(--amber);}
.sens-badge.sens-mod{background:var(--crimson-dim);color:var(--crimson);}
.macro-strip{display:flex;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);flex-wrap:wrap;}
.macro-strip b{color:var(--amber);font-weight:600;}
.macro-bar{background:var(--surface-2);border-radius:8px;height:8px;overflow:hidden;}
.macro-bar-fill{background:var(--amber);height:100%;border-radius:8px;}
.macro-bar-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin-top:4px;}
.habit-list{display:flex;flex-direction:column;gap:10px;}
.habit-row{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text);}
.habit-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--amber);flex-shrink:0;}
.recipe-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--text);display:none;}
.recipe-card.open .recipe-detail{display:block;}
.recipe-detail h4{font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--amber);margin:12px 0 6px;}
.recipe-detail h4:first-child{margin-top:0;}
.recipe-detail ul{margin:0;padding-left:18px;}
.recipe-detail li{margin-bottom:3px;}
.recipe-detail p{margin:0;color:var(--text-dim);}

/* Trackers */
.tselect{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.tselect select{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:10px;font-family:var(--font-mono);font-size:12.5px;}
.field-row{margin-bottom:12px;}
.field-row label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;font-family:var(--font-mono);}
.field-row input[type=text],.field-row textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:13.5px;}
.field-row textarea{resize:vertical;min-height:56px;}
.field-row input:focus,.field-row textarea:focus{outline:none;border-color:var(--amber);}
.scale-row{display:flex;gap:6px;}
.scale-btn{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-dim);font-family:var(--font-mono);font-size:13px;text-align:center;}
.scale-btn.sel{background:var(--amber);border-color:var(--amber);color:#1D0D0B;font-weight:700;}
.wide-btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--amber);font-weight:600;font-size:13px;text-align:center;}
.wide-btn:active{background:var(--amber-dim);}
.photo-row{display:flex;gap:10px;}
.photo-slot{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.photo-thumb{width:100%;aspect-ratio:3/4;border-radius:10px;background:var(--surface-2);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-plus{font-size:26px;color:var(--text-faint);}
.photo-label{font-size:10.5px;color:var(--text-dim);font-family:var(--font-mono);}

/* Gear / settings */
.gear-btn{background:var(--surface);border:1px solid var(--line);color:var(--text-dim);width:30px;height:30px;border-radius:9px;font-size:14px;flex-shrink:0;}
.unit-toggle{display:flex;gap:8px;}
.unit-toggle .filter-chip{flex:1;text-align:center;}

/* Progress */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
.stat-num{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--amber);}
.stat-lbl{font-size:10.5px;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em;}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.badge-chip{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:600;}
canvas{max-width:100%;}

/* Baseline / empty states */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
.empty-state .big{font-family:var(--font-display);font-size:16px;color:var(--text);margin-bottom:6px;}

/* Section header for month view */
.section-divider{font-family:var(--font-display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);margin:18px 0 8px;padding-left:2px;}

/* Modal date picker */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:none;align-items:flex-end;}
.modal-backdrop.show{display:flex;}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:16px;width:100%;max-height:70vh;overflow-y:auto;border:1px solid var(--line);border-bottom:none;}
.modal-sheet h3{font-family:var(--font-display);margin:0 0 12px;font-size:15px;}
.jump-row{display:flex;flex-wrap:wrap;gap:8px;}
.jump-chip{padding:8px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}

/* Print / Save as PDF */
@media print{
  .bottomnav, #settingsBackdrop, .savetoast, .gear-btn, .datenav .arrow, .ex-actions, .month-select, .filter-row, .search-bar { display:none !important; }
  html,body{background:#fff !important;color:#111 !important;}
  .topbar{background:#fff !important;border-color:#ccc !important;}
  .brand{color:#111 !important;}
  .milestone-chip{border-color:#999 !important;color:#333 !important;}
  .card, .week-day-card, .recipe-card, .stat-box{background:#fff !important;border:1px solid #ccc !important;color:#111 !important;}
  .card-title, .phase-name, .stat-num, .weekday{color:#111 !important;}
  .ex-target, .workout-meta, .text-dim, .stat-lbl, .week-day-type, .tl-time{color:#444 !important;}
  .ex-input, .ex-reps, .meal-input, textarea, input[type=text]{background:#f5f5f5 !important;color:#111 !important;border-color:#ccc !important;}
  .recipe-detail{display:block !important;}
  body{padding-bottom:0 !important;}
}

</style>

<div id="topbar-slot"></div>
<div id="app"></div>
<div class="savetoast" id="savetoast">Saved</div>

<div class="modal-backdrop" id="settingsBackdrop">
  <div class="modal-sheet">
    <h3>Settings</h3>
    <div class="field-row">
      <label>Weight unit</label>
      <div class="unit-toggle">
        <div class="filter-chip" id="unitKg">kg</div>
        <div class="filter-chip" id="unitLb">lb</div>
      </div>
    </div>
    <div class="field-row">
      <label>Daily calorie target (optional)</label>
      <input type="text" id="calorieTargetInput" placeholder="e.g. 2400" inputmode="numeric">
    </div>
    <div class="field-row">
      <label>Daily habits (comma-separated)</label>
      <input type="text" id="habitsInput" placeholder="Water, Supplements, Steps goal, Stretching">
    </div>
    <div class="field-row">
      <label>Your data</label>
      <button class="wide-btn" id="exportBtn">Export all data (.json)</button>
    </div>
    <div class="field-row">
      <label>Restore a backup</label>
      <button class="wide-btn" id="importBtn">Import data (.json)</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
    <div class="field-row">
      <label>Print / save as PDF</label>
      <button class="wide-btn" id="printBtn">Print current view</button>
    </div>
    <div class="field-row" style="margin-bottom:6px">
      <label>Add to your home screen</label>
      <p style="font-size:12px;color:var(--text-dim);margin:0;line-height:1.5">iPhone: open this file in Safari &rarr; Share &rarr; Add to Home Screen.<br>Android: open in Chrome &rarr; menu &rarr; Add to Home screen / Install app.</p>
    </div>
    <button class="wide-btn" id="closeSettings" style="color:var(--text-dim)">Close</button>
  </div>
</div>

<nav class="bottomnav">
  <button class="navbtn" data-view="today"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Today</button>
  <button class="navbtn" data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>Calendar</button>
  <button class="navbtn" data-view="trackers"><svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>Trackers</button>
  <button class="navbtn" data-view="recipes"><svg viewBox="0 0 24 24"><path d="M3 3v18M3 8h4M3 13h4M21 21c0-4 0-14-4-18v18"/><circle cx="12" cy="12" r="1"/></svg>Recipes</button>
  <button class="navbtn" data-view="progress"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Progress</button>
</nav>

const RECIPES = [{"title":"Post-Workout Berry-Oat Performance Shake","subtitle":"Training-day breakfast \u2022 1 large shake \u2022 Prep 5 min \u2022 Cook 0 min \u2022 Equipment: blender","macros":{"energy":"~625 kcal","protein":"~55 g","carbs":"~69 g","fat":"~15 g","fibre":"~13 g"},"ingredients":["Certified GF rolled oats 40 g","Pea/rice vegan protein powder 40 g; free from milk, soy, wheat, coconut, banana/apple ingredients","Peanut butter powder 20 g; label-check","Frozen mixed berries 150 g; no apple/banana blend","Unsweetened GF oat drink 350 ml; free from milk/soy/coconut","Ground flaxseed 10 g","Creatine monohydrate 5 g if continuing your established daily routine","Water / ice As needed"],"method":["1. Add oat drink first, then berries, oats, protein powder, peanut powder and flaxseed.","2. Blend 45-60 seconds until completely smooth.","3. Add creatine and blend briefly; use water/ice to reach preferred thickness.","4. Drink after training rather than allowing the blended shake to sit warm."],"storage":"For four gym mornings, pre-weigh four dry ingredient packs (oats, protein, peanut powder and flax) so only liquid, berries and creatine need adding. Best fresh. Dry packs keep in sealed containers; frozen berries remain frozen until use.","variations":["Lighter: reduce oats to 25 g (roughly 55-60 kcal less).","Higher-energy: add 30 g extra GF oats (roughly 110 kcal and ~20 g carbohydrate).","Higher-protein: add 10-15 g extra compatible protein powder and update the label-based macros."],"meal":"Breakfast","sensHigh":[],"sensMod":[]},{"title":"Blueberry-Chia Overnight Protein Oats","subtitle":"Make-ahead breakfast \u2022 1 jar \u2022 Prep 7 min \u2022 Cook + overnight chill \u2022 Equipment: fridge / jar","macros":{"energy":"~610 kcal","protein":"~43 g","carbs":"~73 g","fat":"~18 g","fibre":"~17 g"},"ingredients":["Certified GF rolled oats 70 g","Compatible pea/rice protein 35 g","Unsweetened GF oat drink 250 ml","Blueberries / mixed berries 150 g","Chia seeds 15 g","Pumpkin seeds 15 g","Cinnamon 1-2 g","Water 20-60 ml as needed"],"method":["1. Mix oats, protein powder, chia and cinnamon thoroughly before adding liquid.","2. Stir in oat drink and enough water to make a loose mixture; it thickens overnight.","3. Fold in half the berries, cover and refrigerate for at least 6 hours.","4. Before eating, stir well and top with remaining berries and pumpkin seeds."],"storage":"Prepare up to two jars at once for better texture and freshness rather than making a full week. Keep refrigerated and use within 48 hours. Do not leave at room temperature for prolonged periods.","variations":["Lighter: oats 50 g and pumpkin seeds 10 g.","Training-day: keep 70 g oats or add a small extra rice/potato carbohydrate later if required.","Texture variation: blend half the berries into the oat drink before mixing."],"meal":"Breakfast","sensHigh":[],"sensMod":[]},{"title":"Warm Cinnamon Protein Porridge","subtitle":"Cold-morning / rest-day breakfast \u2022 1 bowl \u2022 Prep 5 min \u2022 Cook 8-10 min \u2022 Equipment: hob or microwave","macros":{"energy":"~510 kcal","protein":"~36 g","carbs":"~46 g","fat":"~14 g","fibre":"~8 g"},"ingredients":["Certified GF oats 60 g","Unsweetened compatible oat drink 250 ml","Vegan protein powder 35 g","Peanut powder 15 g","Cinnamon 2 g","Blueberries 100 g","Water 50-100 ml if needed"],"method":["1. Combine oats, oat drink, cinnamon and half the water in a saucepan.","2. Simmer gently for 5-7 minutes, stirring, until the oats soften.","3. Remove from the heat. Mix protein powder and peanut powder with a splash of cool water, then stir into the","porridge to reduce clumping.","4. Top with blueberries. Add water if you prefer a looser consistency."],"storage":"Pre-weigh dry jars of oats, cinnamon, protein and peanut powder. Keep protein separate if you prefer to cook only the oats first. Cooked porridge is best fresh but can be refrigerated up to 48 hours; reheat with extra liquid until piping hot.","variations":["Higher-protein: add 10 g extra protein powder.","Higher-energy: add 20-30 g extra oats.","Lower-energy: reduce oats to 45 g while keeping protein powder unchanged."],"meal":"Breakfast","sensHigh":[],"sensMod":[]},{"title":"Turkey, Egg & Crispy Potato Breakfast Plate","subtitle":"Rest-day cooked breakfast \u2022 1 large plate \u2022 Prep 10 min \u2022 Cook 20-25 min \u2022 Equipment: air fryer + hob","macros":{"energy":"~690 kcal","protein":"~67 g","carbs":"~59 g","fat":"~22 g","fibre":"~9 g"},"ingredients":["Baby potatoes 300 g raw, halved","Cooked lean turkey breast 120 g; simple ingredient list","Whole eggs 3 large","Liquid egg whites 150 g","Spinach 75 g","Mushrooms 75 g","Red pepper 75 g","Olive oil 10 g total","Paprika, garlic, black pepper, herbs To taste"],"method":["1. Preheat air fryer to 195\u00b0C. Toss potatoes with 5 g oil and seasoning.","2. Air-fry 18-22 minutes, shaking twice, until browned and tender.","3. Meanwhile heat remaining 5 g oil in a non-stick pan; cook mushrooms and pepper 4-5 minutes, then wilt spinach.","4. Add diced cooked turkey and heat through. Pour in beaten eggs and egg whites; cook gently, folding until just set.","5. Serve immediately with the crisp potatoes."],"storage":"For two breakfasts, air-fry 600 g potatoes and prepare 240 g turkey/vegetable mixture. Cook eggs fresh where possible for the best texture. Cooked turkey and vegetables: refrigerate promptly and use within 2-3 days. Reheat until steaming hot. Potatoes re-crisp well in the air fryer.","variations":["Lighter: potatoes 220 g and oil 5 g.","Higher-energy: potatoes 400 g.","Lower-fat / similar protein: use 2 eggs plus 220 g egg whites."],"meal":"Breakfast","sensHigh":[],"sensMod":[]},{"title":"Smoked Salmon, Spinach & Potato Scramble","subtitle":"Higher-protein savoury breakfast \u2022 1 serving \u2022 Prep 8 min \u2022 Cook 15-20 min \u2022 Equipment: air fryer + hob","macros":{"energy":"~600 kcal","protein":"~49 g","carbs":"~48 g","fat":"~23 g","fibre":"~7 g"},"ingredients":["Baby potatoes 250 g raw","Whole eggs 3 large","Liquid egg whites 120 g","Smoked salmon 100 g; check ingredients","Spinach 80 g","Cherry tomatoes 100 g","Olive oil 5 g","Black pepper, dill, lemon To taste"],"method":["1. Air-fry potatoes at 195\u00b0C with oil for about 18-20 minutes, shaking during cooking.","2. Whisk eggs and egg whites. Cook gently in a non-stick pan until almost set.","3. Fold in spinach to wilt, then remove from direct heat and fold through smoked salmon so it warms without","becoming dry.","4. Serve with tomatoes, potatoes, dill and lemon."],"storage":"Potatoes can be cooked in a two-day batch. Keep the salmon chilled and cook the scramble fresh. Follow the smoked- salmon pack's storage instructions. Refrigerate cooked potatoes promptly and reheat until piping hot.","variations":["Lower-fat: 2 whole eggs + 180 g egg whites.","Higher-carbohydrate training option: increase potatoes to 350 g.","Fresh-fish variation: use cooked salmon left from a planned dinner instead of smoked salmon.","Turkey & Vegetable Breakfast Muffins","Portable batch breakfast \u2022 6 muffins / 3 servings \u2022 Prep 15 min \u2022 Cook 22-26 min \u2022 Equipment: oven + muffin"],"meal":"Breakfast","sensHigh":[],"sensMod":[]},{"title":"Turkey & Vegetable Breakfast Muffins","subtitle":"Portable batch breakfast \u2022 6 muffins / 3 servings \u2022 Prep 15 min \u2022 Cook 22-26 min \u2022 Equipment: oven + muffin tin","macros":{"energy":"~360 kcal","protein":"~40 g","carbs":"~10 g","fat":"~17 g","fibre":"~3 g"},"ingredients":["Lean turkey mince 300 g raw","Whole eggs 4 large","Liquid egg whites 200 g","Red pepper 100 g finely diced","Spinach 80 g chopped","Mushrooms 100 g finely diced","Olive oil 5 g for pan/tin","Paprika, garlic, herbs, pepper To taste"],"method":["1. Heat oven to 180\u00b0C fan. Lightly grease six large muffin wells.","2. Brown turkey mince in a pan until fully cooked; add mushrooms and pepper and cook until excess moisture","reduces.","3. Remove from heat and stir in spinach to wilt. Cool for several minutes.","4. Whisk eggs and egg whites, combine with turkey mixture, then divide evenly between six wells.","5. Bake 22-26 minutes until fully set in the centre. Cool briefly before removing."],"storage":"Two muffins make one protein-focused serving. Pair with a planned carbohydrate such as 200-300 g potatoes, GF oats or fruit when you need a larger breakfast. Cool quickly, refrigerate in a sealed container and use within 3 days. Reheat thoroughly. Freeze individual muffins for longer storage and thaw in the refrigerator.","variations":["Larger meal: add 250 g air-fried potatoes (~190 kcal before oil).","Lower-fat batch: use 2 eggs and increase egg whites.","Flavour variation: use smoked paprika + oregano, or curry spices without flagged sauce ingredients."],"meal":"Other","sensHigh":[],"sensMod":[]},{"title":"Berry-Chia Protein Pot","subtitle":"No-cook light breakfast / snack \u2022 1 pot \u2022 Prep 5 min \u2022 Cook + 4 h chill \u2022 Equipment: jar / fridge","macros":{"energy":"~390 kcal","protein":"~31 g","carbs":"~24 g","fat":"~15 g","fibre":"~11 g"},"ingredients":["Chia seeds 25 g","Compatible vegan protein 30 g","Unsweetened GF oat drink 200 ml","Mixed berries 100 g","Cinnamon or vanilla To taste","Water 30-60 ml as needed"],"method":["1. Whisk protein powder into oat drink until smooth.","2. Stir in chia seeds and flavouring; wait 5 minutes and stir again to prevent clumps.","3. Fold in half the berries, cover and chill for at least 4 hours.","4. Top with remaining berries before eating."],"storage":"Make two pots at a time. This is useful as a smaller breakfast or as a protein-rich addition when the rest of the day contains larger meals. Keep refrigerated and use within 48 hours.","variations":["Larger breakfast: add 40 g GF oats before chilling.","Higher-protein: increase compatible protein powder to 40 g.","More crunch: add a weighed portion of tolerated pumpkin seeds.","Quinoa, Turkey & Blueberry Breakfast Bowl","Alternative grain breakfast \u2022 1 bowl \u2022 Prep 8 min \u2022 Cook 5 min if quinoa pre-cooked \u2022 Equipment: hob /"],"meal":"Breakfast","sensHigh":[],"sensMod":[]},{"title":"Quinoa, Turkey & Blueberry Breakfast Bowl","subtitle":"Alternative grain breakfast \u2022 1 bowl \u2022 Prep 8 min \u2022 Cook 5 min if quinoa pre-cooked \u2022 Equipment: hob / microwave","macros":{"energy":"~500 kcal","protein":"~44 g","carbs":"~48 g","fat":"~14 g","fibre":"~7 g"},"ingredients":["Cooked quinoa 180 g","Cooked turkey breast 130 g","Spinach 60 g","Blueberries 100 g","Pumpkin seeds 10 g","Olive oil 5 g","Lemon, herbs, black pepper To taste"],"method":["1. Warm quinoa and turkey thoroughly with a splash of water.","2. Wilt spinach into the hot mixture and season with herbs, pepper and lemon.","3. Transfer to a bowl and add blueberries and pumpkin seeds.","4. Eat warm; the fruit provides a sweet contrast without using apple or banana."],"storage":"Cook quinoa in a 3-portion batch and cool it promptly. Portion turkey separately so the bowl can be assembled in minutes. Refrigerate cooked quinoa and turkey promptly and use within 2-3 days; reheat until steaming hot. Add berries after reheating.","variations":["Higher-energy: cooked quinoa 250 g.","Lighter: quinoa 130 g and omit olive oil if the pan is non-stick.","Protein boost: increase turkey to 170 g.","Breakfast Rotation - 2-Week Example","DAY BREAKFAST USE","Mon W1 Post-workout berry-oat shake Training","Tue W1 Post-workout berry-oat shake Training","Wed W1 Turkey, egg & potato plate Recovery","Thu W1 Warm protein porridge Training / lighter option","Fri W1 Post-workout berry-oat shake Training","Sat W1 Smoked salmon scramble Rest / active recovery","Sun W1 Blueberry overnight oats Meal-prep day","Mon W2 Post-workout shake - higher oat variation Training","Tue W2 Turkey breakfast muffins + potatoes Training / portable","Wed W2 Quinoa turkey blueberry bowl Recovery","Thu W2 Warm cinnamon porridge Training","Fri W2 Post-workout shake Training","Sat W2 Turkey egg potato plate - lighter variation Rest","Sun W2 Berry-chia pot + added GF oats Meal-prep day","Sunday breakfast prep - 25 minutes","Make two overnight jars for the next 48 hours only.","Pre-weigh four dry shake packs for training mornings.","Cook a batch of quinoa if using the quinoa breakfast bowl early in the week.","Wash/portion berries and vegetables; keep berries refrigerated/frozen as appropriate.","If making breakfast muffins, bake a six-muffin batch and freeze any portion not needed within three days.","Part 3","The next section will move into work lunches and portable meal-prep boxes: chicken, turkey, tuna, quinoa/rice/potato","combinations, cold lunches, reheatable lunches, 3-day batch plans and exact container-by-container prep.","V4 packaged-ingredient rule: for passata, stock, plant drink, protein powder, baking powder, canned foods and other labelled products, use a version","free from the report's high/moderate reactive foods and flagged additives. If the label is uncertain, use a simpler whole-food alternative.","PERSONAL NUTRITION & RECIPE MANUAL","PART 3 \u2022 WORK LUNCHES & PORTABLE MEAL-PREP SYSTEMS","V4 INTOLERANCE AUDIT: Core recipes in this part have been checked against the uploaded 2019 food-sensitivity report. High","and moderate-reactivity foods are excluded from the core recipes; packaged ingredients must also be label-checked for the","flagged additives.","These lunches continue the conservative core used in Parts 1-2: the high- and moderate-reactivity foods remain outside the","core recipes, and packaged stocks, sauces, seasonings and processed meats require label checks. The established starting","framework is roughly 2,200-2,300 kcal/day and 175-185 g protein/day, so most lunches here provide a substantial 45-70+ g","protein anchor.","Work-lunch design rules","FORMAT BUILD USE","Protein + weighed starch + 200-300 g","Hot meal box Best for microwave access","vegetables","Cold ook 25 min \u2022 Air fryer / oven + hob","macros":{"energy":"~690 kcal","protein":"~57 g","carbs":"~72 g","fat":"~20 g","fibre":"~12 g"},"ingredients":["Lean turkey mince 220 g raw","Baby potatoes 350 g raw","Courgette 100 g","Red pepper 100 g","Carrot 100 g","Spinach 60 g","Olive oil 10 g","Paprika, cumin, garlic, pepper To taste"],"method":["1. Cut potatoes evenly; toss with 5 g oil and seasoning. Air-fry at 195\u00b0C for 20-24 minutes, shaking twice.","2. Brown turkey mince thoroughly in a pan with garlic, paprika and cumin.","3. Roast or air-fry courgette, pepper and carrot with remaining oil until tender.","4. Stir spinach through the hot turkey until wilted, then portion with potatoes and roasted vegetables."],"storage":"For 3 portions use 660 g turkey mince and 1.05 kg potatoes. Cook potatoes in batches rather than overcrowding the air fryer. Refrigerate promptly for up to about 3 days. Reheat until piping hot; potatoes can be reheated separately in the air fryer for better texture.","variations":["Lighter: potatoes 250 g and oil 5 g.","Higher-protein: turkey 260 g.","Sweet-potato variation: substitute the same raw weight of sweet potato and update macros."],"meal":"Dinner","sensHigh":[],"sensMod":[]},{"title":"Chicken, Quinoa & Avocado Cold Salad","subtitle":"Cold portable lunch \u2022 1 serving \u2022 Prep 15 min \u2022 Cook 20 min \u2022 Air fryer + hob","macros":{"energy":"~750 kcal","protein":"~72 g","carbs":"~59 g","fat":"~25 g","fibre":"~12 g"},"ingredients":["Chicken breast 220 g raw","Quinoa 65 g dry","Avocado 80 g","Mixed leaves 80 g","Cucumber 120 g","Tomatoes 120 g","Red pepper 80 g","Olive oil 5 g","Lemon/lime juice, herbs, pepper To taste"],"method":["1. Cook quinoa, spread it on a clean tray and cool promptly.","2. Season and air-fry chicken at 190\u00b0C until safely cooked through; rest, slice and cool.","3. Combine leaves, cucumber, tomato and pepper in a chilled container. Add cooled quinoa and chicken.","4. Pack avocado and lemon dressin sensMod":[]},{"title":"Chicken Fajita Rice Box - Sauce-Free","subtitle":"Reheatable work lunch \u2022 1 serving \u2022 Prep 12 min \u2022 Cook 20 min \u2022 Air fryer + hob","macros":{"energy":"~720 kcal","protein":"~68 g","carbs":"~82 g","fat":"~14 g","fibre":"~10 g"},"ingredients":["Chicken breast 220 g raw, strips","Basmati rice 85 g dry","Red/yellow peppers 180 g","Onion 80 g","Courgette 80 g","Olive oil 10 g","Paprika 2 g","Cumin 1 g","Garlic powder / fresh garlic To taste","Lime juice, coriander To finish"],"method":["1. Cook rice according to the pack.","2. Toss chicken with 5 g oil, paprika, cumin and garlic. Air-fry at 190\u00b0C for roughly 12-16 minutes, shaking once, until safely","cooked.","3. Cook peppers, onion and courgette with remaining oil until softened but still colourful.","4. Combine rice, chicken and vegetables. Finish with lime and coriander rather than a bottled fajita sauce."],"storage":"For 3 boxes use 660 g chicken, 255 g dry rice, 540 g peppers, 240 g onion and 240 g courgette. Cool and refrigerate promptly; use within about 3 days. Reheat until steaming hot.","variations":["Lighter: rice 65 g dry.","Higher-energy: rice 105 g dry.","Spicier: add cayenne or fresh chilli if tolerated."],"meal":"Lunch","sensHigh":[],"sensMod":[]},{"title":"Turkey Meatball Polenta Box","subtitle":"Comfort-food lunch \u2022 1 serving \u2022 Prep 15 min \u2022 Cook 25 min \u2022 Oven / air fryer + hob","macros":{"energy":"~700 kcal","protein":"~61 g","carbs":"~70 g","fat":"~19 g","fibre":"~9 g"},"ingredients":["Lean turkey mince 220 g raw","Dry polenta 70 g","Passata 200 g; label-check","Courgette 100 g","Spinach 80 g","Olive oil 10 g","Garlic, oregano, basil, pepper To taste","Egg 1/2 large equivalent, about 25 g, for binding"],"method":["1. Heat oven to 200\u00b0C fan. Mix turkey with egg, garlic, oregano and pepper; shape into meatballs.","2. Bake 16-20 minutes, turning once, until safely cooked through.","3. Simmer passata with courgette and herbs; add spinach at the end. Check the passata contains no flagged additions.","4. Cook polenta according to pack instructions using water. Portion polenta, sauce and meatballs."],"storage":"For 4 portions use 880 g turkey mince, 2 eggs, 280 g dry polenta and 800 g passata. Freeze two portions if they will not be eaten within 3 days. Refrigerate up to about 3 days or freeze once cooled. Reheat thoroughly; loosen polenta with water when reheating.","variations":["Lighter: polenta 50 g dry and oil 5 g.","Higher-energy: polenta 90 g dry.","Potato alternative: serve meatballs with 300-350 g roasted potato."],"meal":"Lunch","sensHigh":[],"sensMod":[]},{"title":"Air-Fryer Steak & Potato Lunch Box","subtitle":"Premium reheatable lunch \u2022 1 serving \u2022 Prep 10 min \u2022 Cook 22 min \u2022 Air fryer","macros":{"energy":"~690 kcal","protein":"~54 g","carbs":"~63 g","fat":"~24 g","fibre":"~9 g"},"ingredients":["Lean sirloin steak 200 g raw, visible fat trimmed as desired","Baby potatoes 300 g raw","Green beans 150 g","Red pepper 100 g","Olive oil 10 g","Rosemary, garlic, black pepper To taste","Lemon To finish"],"method":["1. Air-fry potatoes with 5 g oil at 195\u00b0C for about 18-22 minutes, shaking during cooking.","2. Bring steak toward room temperature briefly while potatoes cook; season simply.","3. Air-fry steak according to thickness and appliance, turning once. Use a food thermometer if needed to achieve your","preferred safe doneness, then rest before slicing.","4. Cook green beans and pepper with remaining oil; pack steak separately over vegetables to avoid overcooking during","reheating."],"storage":"For 2 lunches use 400 g steak and 600 g potatoes. Steak is best prepared in smaller batches rather than for five days. Refrigerate promptly and use within 2 days for best quality. Reheat gently; avoid repeatedly reheating steak.","variations":["Lighter: potatoes 220 g and oil 5 g.","Higher-energy: potatoes 400 g.","Cold steak salad: cool sliced steak and serve with quinoa/leaves instead of reheating."],"meal":"Lunch","sensHigh":[],"sensMod":[]},{"title":"Salmon, Potato & Green-Bean Lunch Box","subtitle":"Oily-fish lunch \u2022 1 serving \u2022 Prep 8 min \u2022 Cook 25 min \u2022 Oven / air fryer","macros":{"energy":"~720 kcal","protein":"~46 g","carbs":"~61 g","fat":"~32 g","fibre":"~10 g"},"ingredients":["Salmon fillet 180 g raw","Baby potatoes 300 g raw","Green beans 180 g","Cherry tomatoes 100 g","Olive oil 5 g","Lemon, dill, garlic, black pepper To taste"],"method":["1. Start potatoes first at 195\u00b0C in the air fryer or 200\u00b0C fan in the oven with oil and seasoning.","2. Add salmon once the potatoes have roughly 10-12 minutes remaining, adjusting for fillet thickness.","3. Steam or roast green beans; warm tomatoes briefly.","4. Cool promptly if preparing for work. Finish with lemon after reheating rather than before storage."],"storage":"Prepare no more than 2-3 fish lunches at once. For 2 portions use 360 g salmon and 600 g potatoes. Keep chilled and use promptly, following the fish pack's storage guidance. Reheat once until steaming hot, or eat cold if properly chilled and you prefer it.","variations":["Lighter: potatoes 220 g.","Higher-energy: potatoes 400 g.","Alternative tolerated oily fish may be used only if it is outside your exclusion list and individually tolerated."],"meal":"Lunch","sensHigh":[],"sensMod":[]},{"title":"Turkey Chilli & Brown Rice Box","subtitle":"Freezer-friendly batch lunch \u2022 1 serving \u2022 Prep 15 min \u2022 Cook 35 min \u2022 Hob / slow cooker option","macros":{"energy":"~750 kcal","protein":"~62 g","carbs":"~88 g","fat":"~17 g","fibre":"~16 g"},"ingredients":["Lean turkey mince 220 g raw","Brown rice 75 g dry","Kidney beans 120 g drained","Passata 200 g; label-check","Red pepper 100 g","Onion 70 g","Olive oil 10 g","Cumin, paprika, chilli, garlic, oregano To taste"],"method":["1. Cook rice separately.","2. Brown turkey in oil, then add onion and pepper and cook until softened.","3. oodles with a weighed cooked-rice portion.","3-Day Work-Lunch Prep System","This system deliberately uses a three-day horizon. It keeps cooked food fresher, reduces texture loss and makes the midweek","changeover easier.","CONTAINER MEAL DAY STORAGE","Box 1 Lemon-herb chicken quinoa Mon Refrigerate","Box 2 Turkey potato bowl Tue Refrigerate","Box 3 Chicken fajita rice box Wed Refrigerate","Sunday shopping quantities for the three boxes","ITEM BUY / PREP","Chicken breast 440 g raw","Lean turkey mince 220 g raw","Quinoa 70 g dry","Basmati rice 85 g dry","Baby potatoes 350 g raw","Broccoli 150 g","Peppers 380 g","Courgette 180 g","Carrot 100 g","Spinach 60 g","Onion 80 g","Olive oil 30 g","Lemons/limes, garlic, herbs/spices As required","Efficient 60-minute prep order","1. Heat the oven/air fryer and start the potatoes first.","2. Put quinoa and rice on in separate pans; once cooked, cool promptly.","3. Season both chicken batches differently so the boxes do not taste identical.","4. Cook turkey while the chicken and potatoes are working.","5. Roast/air-fry the vegetables in batches; keep some peppers/onions for the fajita box.","6. Weigh finished components into labelled containers rather than guessing portions.","7. Cool food promptly, lid and refrigerate. Do not leave cooked rice or poultry sitting warm for extended periods.","5-Day Work-Lunch Strategy","For five workdays, use a Sunday + Wednesday system instead of keeping all five cooked lunches in the refrigerator from","Sunday.","WHEN ACTION WHY","Sunday Prepare Mon-Wed 3 refrigerated lunches","2 fresh lunches or 1 fresh + 1","Wednesday evening Prepare Thu-Fri","frozen/defrosted batch meal","Good freezer candidates Turkey chilli; turkey meatballs Freeze promptly in individual portions","Best fresh candidates Salmon; prawns; avocado salads Prepare closer to the day eaten","Container-by-container macro adjustment","GOAL ADJUSTMENT RULE","Remove ~25 g dry rice/quinoa equivalent OR","Need ~100 kcal less Keep protein ionally and makes the year-long plan","easier to sustain."],"meal":"Snack","sensHigh":[],"sensMod":[]},{"title":"Air-Fryer Lemon-Dill Salmon, Potatoes & Greens","subtitle":"Oily-fish dinner \u2022 1 serving \u2022 Prep 8 min \u2022 Cook 25 min \u2022 Air fryer","macros":{"energy":"~730 kcal","protein":"~48 g","carbs":"~64 g","fat":"~32 g","fibre":"~10 g"},"ingredients":["Salmon fillet 180 g raw","Baby potatoes 320 g raw","Broccoli 180 g","Green beans 120 g","Olive oil 5 g","Lemon juice 20 g","Dill, garlic, black pepper To taste"],"method":["1. Start potatoes at 195\u00b0C with oil and seasoning; air-fry 18-22 minutes, shaking twice.","2. Season salmon with dill, garlic and pepper. Add during the final 9-13 minutes depending on thickness and appliance.","3. Cook broccoli and beans until tender-crisp.","4. Check salmon is cooked appropriately, rest briefly and finish with lemon."],"storage":"For two portions use 360 g salmon and 640 g potatoes. Avoid preparing a full five-day fish batch. Cool promptly if storing. Refrigerate and use within the fish pack's safe timeframe; reheat once until hot or eat properly chilled.","variations":["Lighter: potatoes 230 g.","Hard-training: potatoes 420 g.","Vegetable variation: use asparagus or courgette if tolerated."],"meal":"Dinner","sensHigh":[],"sensMod":[]},{"title":"Salmon & Quinoa Mediterranean Bowl","subtitle":"Warm or cold bowl \u2022 1 serving \u2022 Prep 12 min \u2022 Cook 20 min \u2022 Oven/air fryer + hob","macros":{"energy":"~770 kcal","protein":"~49 g","carbs":"~62 g","fat":"~35 g","fibre":"~11 g"},"ingredients":["Salmon fillet 170 g","Quinoa 70 g dry","Tomatoes 150 g","Cucumber 120 g","Spinach/leaves 80 g","Red pepper 100 g","Avocado 60 g","Lemon juice 20 g","Herbs, pepper To taste"],"method":["1. Cook quinoa and allow it to steam dry.","2. Cook salmon at 190-200\u00b0C until appropriately cooked, then rest.","3. Chop salad vegetables. For a warm bowl, wilt spinach; for a cold bowl, cool quinoa and salmon promptly first.","4. Assemble with avocado, lemon and herbs. No dairy dressing is required."],"storage":"Make no more than two or three portions. Keep avocado separate until serving. Keep cold bowls refrigerated and transport chilled. Use fish promptly.","variations":["Lighter: avocado 30 g and quinoa 55 g.","Higher-energy: quinoa 90 g.","No-avocado: omit and use 5-10 g weighed olive oil if needed."],"meal":"Dinner","sensHigh":[],"sensMod":[]},{"title":"Tomato-Spinach Salmon Curry & Rice","subtitle":"Curry night \u2022 1 serving \u2022 Prep 12 min \u2022 Cook 25 min \u2022 Hob","macros":{"energy":"~745 kcal","protein":"~47 g","carbs":"~79 g","fat":"~27 g","fibre":"~9 g"},"ingredients":["Salmon 180 g, large cubes","Basmati rice 80 g dry","Passata 220 g","Spinach 120 g","Red pepper 100 g","Onion 70 g","Olive oil 5 g","Fresh ginger 10 g","Garlic, cumin, coriander, turmeric, chilli To taste"],"method":["1. Cook rice separately.","2. Soften onion and pepper in oil. Add ginger, garlic and dry spices briefly.","3. Add passata and simmer 5-8 minutes. Gently add salmon pieces and cook without aggressive stirring until done.","4. Fold in spinach and serve with rice. This curry intentionally contains no coconut milk or dairy."],"storage":"For two portions double ingredients. Salmon curry is better made in small batches. Cool promptly and refrigerate. Reheat gently but fully to avoid breaking the salmon apart.","variations":["Lighter: rice 60 g dry.","Higher-energy: rice 100 g dry.","Prawn version: use compatible prawns and shorten cooking time."],"meal":"Dinner","sensHigh":[],"sensMod":[]},{"title":"Tuna, Potato & Egg Power Salad","subtitle":"Cold high-protein meal \u2022 1 serving \u2022 Prep 12 min \u2022 Cook 20 min \u2022 Hob","macros":{"energy":"~690 kcal","protein":"~60 g","carbs":"~58 g","fat":"~24 g","fibre":"~10 g"},"ingredients":["Tuna in spring water 160 g drained","Potatoes 300 g raw","Whole eggs 2 large","Green beans 150 g","Tomatoes 120 g","Spinach/leaves 60 g","Olive oil 1 st or steam broccoli, carrot and courgette.","4. Divide rice, vegetables and salmon into a container; add lemon after reheating."],"storage":"Prepare no more than two or three fish boxes at once. Rice must be cooled promptly and refrigerated. Keep refrigerated and use promptly. Reheat once until hot throughout.","variations":["Lighter: rice 60 g dry.","Higher-energy: rice 100 g dry.","Quinoa version: use 70-90 g dry quinoa."],"meal":"Lunch","sensHigh":[],"sensMod":[]},{"title":"Tuna & Quinoa Pepper Boats","subtitle":"Oven meal / lunch \u2022 2 servings \u2022 Prep 15 min \u2022 Cook 25 min \u2022 Fan oven","macros":{"energy":"~575 kcal","protein":"~48 g","carbs":"~59 g","fat":"~16 g","fibre":"~11 g"},"ingredients":["Large bell peppers 4 halves, about 400 g","Tuna in spring water 300 g drained","Quinoa 120 g dry","Passata 200 g","Spinach 100 g","Olive oil 10 g","Garlic, oregano, parsley, pepper To taste","Avocado 60 g total"],"method":["1. Heat oven to 190\u00b0C fan. Bake pepper halves for 8 minutes.","2. Cook quinoa. Mix with tuna, passata, spinach and herbs.","3. Fill pepper halves and bake 15-18 minutes until piping hot.","4. Serve each portion with 30 g avocado added fresh."],"storage":"One batch makes two large servings. Double for four and use two trays. Refrigerate cooled boats and use promptly. Reheat thoroughly, then add avocado.","variations":["Lighter: omit avocado.","Higher-energy: increase quinoa to 160 g per batch.","Portable lunch: eat chilled only if properly stored and transported.","Fish & Seafood - 2-Week Rotation","DAY MEAL ROLE","Mon W1 Air-fryer lemon-dill salmon Oily fish","Tue W1 Prawn rice-noodle bowl Fast","Wed W1 Tuna potato egg salad Cold / portable","Thu W1 Salmon tomato-spinach curry Curry","Fri W1 Tuna stuffed sweet potato Pantry","Sat W1 Salmon quinoa avocado bowl Premium bowl","Sun W1 Prawn lentil curry Batch base","Mon W2 Salmon brown-rice box Work lunch","Tue W2 Prawn paprika potato bowl Air fryer","Wed W2 Tuna quinoa pepper boats  Both are valid, but the response differs","simply want something sweet","2 If hungry, choose a protein-containing snack More satisfying than a tiny sweet alone","If it is a treat craving, choose one pre-portioned","3 Plate it; do not eat from the batch","dessert","Eat it slowly with tea/water and end the kitchen","4 Creates a clear finish","session","If cravings are frequent, review dinner size, Repeated hunger may mean the plan is too","5","protein, fibre and overall calorie target aggressive","Sweet-Treat Rotation - 2 Weeks","DAY TREAT ROLE","Mon W1 Frozen berry protein bowl High protein","Wed W1 Pear-cinnamon oat pot Warm","Sat W1 Berry oat crumble Planned dessert","Sun W1 Frozen pop Light","Tue W2 Protein rice pudding Meal prep","Thu W2 2 protein muffins Work/evening","Sat W2 Sweet-potato brownie Planned dessert","Sun W2 Protein pancake stack Higher-energy","Part 12","Part 12 will build the practical meal-prep and year-round rotation system: weekly shopping lists, Sunday and midweek prep","sessions, freezer inventory, protein/starch/vegetable batch quantities, mix-and-match meal formulas, portion scaling for","lighter and harder-training days, and a structured recipe rotation so the manual remains useful across the full year.","V4 packaged-ingredient rule: for passata, stock, plant drink, protein powder, baking powder, canned foods and other labelled products, use a version","free from the report's high/moderate reactive foods and flagged additives. If the label is uncertain, use a simpler whole-food alternative.","PERSONAL NUTRITION & RECIPE MANUAL","PART 12 \u2022 MEAL PREP & YEAR-ROUND ROTATION SYSTEM","V4 INTOLERANCE AUDIT: Core recipes in this part have been checked against the uploaded 2019 food-sensitivity report. High","and moderate-reactivity foods are excluded from the core recipes; packaged ingredients must also be label-checked for the","flagged additives.","This section turns the recipe library into a repeatable operating system. The goal is variety without daily decision fatigue: prepare","core components, rotate proteins and cooking methods, keep fish fresher with shorter prep windows, and use the freezer to create a","growing bank of complete meals.","The 4-layer system","LAYER ACTION RESULT","Choose 7 dinners + 5 work lunches +","1. Weekly menu Stops random shopping","breakfasts/snacks","2. Core prep Cook 2 proteins, 2 starches, 3-4 vegetables Creates mix-and-match meals","3. Fresh top-up Midweek fish/seafood + fresh vegetables Improves quality and variety","4. Freezer bank Freeze slow-cooker/curry portions Builds emergency meals","Portion philosophy","Keep protein relatively stable and move energy mainly through starch and added fats. The exact calorie target should be adjusted","from real progress, hunger, training performance and body-weight trend rather than forcing every day to be identical.","Sunday Prep - 75 Minute Workflow","A practical prep session for a standard week. Use the oven, air fryer and hob in parallel rather than cooking one item at a time.","TIME TASK OUTPUT","Start oven/air fryer; wash/chop vegetables;","0-10 min Set up","start rice/quinoa","Season chicken/turkey; load first protein;","10-25 min Protein 1","portion potatoes","Cook second protein; roast vegetables; cool first","25-40 min Protein 2","items","Finish starches; portion lunch boxes; make","40-55 min Assembly","sauce/dressing","55-65 min Cool food rapidly in shallow containers Food safety","Label 2-3 day portions; freeze surplus; clean","65-75 min Finish","down","Example Sunday quantities - 1 person","FOOD PREP AMOUNT USE","Chicken breast 700-900 g raw 3-4 meals","Turkey mince/breast 450-650 g raw 2-3 meals","Rice 250-320 g dry 3-4 starch portions","Quinoa 120-160 g dry 2 portions","Potato/sweet potato 1.2-1.6 kg raw 4-5 portions","Mixed vegetables 1.5-2.0 kg Across lunches/dinners","Do not automatically cook seven days of fish, rice and vegetables at once. Shorter prep horizons generally improve quality and reduce","food-safety mistakes.","Midweek Top-Up - 25 Minutes","A Wednesday-style refresh prevents the week from becoming five-day leftovers.","AREA ACTION TARGET","Buy/defrost and cook salmon or prawns close","Fish/seafood 2 meals","to eating","Fresh starch Cook 2 rice/quinoa portions or air-fry potatoes 2-3 meals","Vegetables Chop/roast 600-900 g 2-3 days","Fruit/snacks Restock tolerated fruit and pre-portioned treats Remainder of week","Move one frozen slow-cooker/curry portion to","Freezer Emergency cover","fridge","25-minute sequence","1. Start rice/quinoa or potatoes immediately.","2. Prepare vegetables while starch cooks.","3. Cook a fresh fish/seafood meal or prepare it for that evening.","4. Cool any batch starch promptly.","5. Restock work snacks and select one freezer meal for later in the week.","Mix-and-Match Meal Builder","Use one item from each column. This creates dozens of combinations without needing a new recipe every night.","PROTEIN STARCH VEGETABLES FLAVOUR METHOD","Chicken breast Rice Broccoli + pepper Tomato-herb Air fryer","Turkey Potato Carrot + courgette Roasted pepper Oven","Lean beef/steak Sweet potato Green beans + mushrooms Curry tomato Hob","Salmon Quinoa Asparagus + spinach Lemon-herb Air fryer/oven","Prawns Rice noodles/rice Pak choi + pepper Ginger-lime Hob","Standard build","COMPONENT PORTION RANGE NOTE","Lean poultry 200-250 g raw ~45-60 g protein depending on cut","Lean beef 180-230 g raw Adjust for fat content","Salmon 160-190 g raw Higher-fat protein","Prawns 200-230 g raw Lean seafood option","Vegetables 250-400 g Use variety","Dry rice/quinoa 60-100 g Move with activity","Potato/sweet potato 250-450 g raw Alternative starch","Added oil 0-10 g Weigh it","Training-Day Portion Scaling","Use the same meal and adjust the energy around it rather than cooking completely different food.","DAY TYPE PROTEIN STARCH ADDED FAT RULE","Rice 55-70 g dry or potato","Lighter/rest Protein unchanged 0-5 g oil High veg","250-300 g","Rice 75-85 g dry or potato","Standard Protein unchanged 5-10 g oil Default","320-380 g","Rice 95-110 g dry or potato","Hard training Protein unchanged 5-10 g oil More carbs","420-500 g","Practical adjustment rules","Training performance poor for several sessions: first review sleep, hydration and carbohydrate availability.","Weight loss too fast with persistent hunger/low energy: increase food modestly rather than relying on willpower.","Progress stalled for several weeks: review actual portions, oils, snacks, alcohol and weekend intake before cutting protein.","Protein stays the anchor; carbohydrates and added fats are the main adjustment levers.","Workday Packed-Lunch System","Build lunches from components that travel and reheat well.","LUNCH BUILD ROLE","Chicken rice box 220 g chicken + 250 g cooked rice + 300 g veg Standard","Turkey quinoa box 220 g turkey + 220 g cooked quinoa + 300 g veg Higher fibre","Beef potato box 200 g lean beef + 350 g potato + 300 g veg Hearty","Salmon rice box 170 g salmon + 230 g cooked rice + 300 g veg Short prep horizon","1 labelled frozen portion + fresh veg/starch if","Slow-cooker box Emergency","needed","Packing sequence","1. Cool cooked food before sealing containers.","2. Keep cold food chilled during transport.","3. Pack sauces separately when they make food soggy.","4. Use a labelled portion rather than guessing serving size at work.","5. Keep a backup protein shake and shelf-stable compatible snack available for disrupted days.","Emergency Meals - 10, 15 & 20 Minutes","The emergency system is designed to beat takeaway by being easier than ordering.","TIME MEAL METHOD","Tuna + pre-cooked potato/rice + salad","~10 min No batch cooking","vegetables + lemon","Protein shake + oats + frozen fruit + compatible","~10-15 min Breakfast/emergency","oat drink","Thin chicken strips + cooked rice + air-fryer","~15 min Air fryer","vegetables","~15 min Prawns + rice noodles + frozen/fresh vegetables Hob","~20 min Turkey burger + air-fryer potato wedges + salad Air fryer","~20 min Steak strips + quinoa/rice + peppers Hob/air fryer","Emergency freezer minimum","ITEM TARGET STOCK","Slow-cooker meals 4 individual portions","Curries 3 individual portions","Turkey/chicken meatballs 2 portions","Cooked rice/quinoa 1-2 small portions if safely cooled/frozen","Protein muffins/bites 4-6 portions","Weekly Shopping List - Standard Week","Quantities are a planning template, not a prescription. Adjust to the exact seven meals selected.","CATEGORY WEEKLY STARTING QUANTITY","Chicken/turkey 1.4-1.8 kg raw","Lean beef/steak 450-700 g raw","Salmon/prawns/tuna 3-4 seafood meals total","Eggs 6-10","Rice/quinoa/oats ~1.0-1.4 kg combined dry pantry use","Potato/sweet potato 2.0-3.0 kg","Vegetables 3.5-5.0 kg mixed","Fruit/berries 1.5-2.5 kg mixed/frozen","Compatible oat drink 2-4 L depending on breakfast/snacks","Vegan protein powder Check 7-14 shake/snack servings","Pantry check","Passata, tomato puree, rice flour, tapioca/potato starch, red lentils, herbs, spices, olive oil, frozen berries and compatible baking","ingredients should be checked before shopping so they are not repeatedly over-bought.","4-Week Shopping & Stock Strategy","Do not buy four weeks of fresh meat and vegetables at once. The monthly view is for pantry/freezer planning.","CATEGORY 4-WEEK APPROACH STORAGE","Dry rice/quinoa/oats 4-6 kg combined depending on intake Bulk pantry","Passata/tomato products 12-20 recipe units Cupboard","Frozen berries/fruit 4-8 kg Freezer","Protein powder Estimate from daily serving use Pantry","Buy weekly or freeze in meal-sized raw","Meat/fish Freezer","portions","Vegetables Buy weekly; frozen veg can back up fresh Fresh/freezer","Spices Monthly inventory Pantry","Freezer portioning before storage","Chicken/turkey: freeze in 220-250 g raw meal portions or recipe-sized batches.","Steak/beef: freeze by planned recipe weight rather than large anonymous packs.","Fish: freeze individual fillets where suitable and use within product guidance.","Label every item with food, raw/cooked status, weight and date.","Freezer Inventory System","The freezer should function like a menu, not a storage graveyard.","ITEM PORTIONS DATE USE NEXT","Chicken curry ___ ___ ___","Beef stew ___ ___ ___","Turkey curry/meatballs ___ ___ ___","Shredded chicken/beef ___ ___ ___","Protein treats ___ ___ ___","Raw meal-size protein ___ ___ ___","First-in, first-out rule","Put newly frozen meals behind older ones. Once a week, choose at least one older freezer meal for the next week's menu. This keeps","the freezer rotating and reduces waste.","Container label","FIELD EXAMPLE","Dish Chicken tomato curry","Portion 1 serving","Date ____ / ____ / ____","Approx macros ____ kcal | P ___ | C ___ | F ___","Reheat note Defrost chilled; reheat thoroughly","4-Week Master Dinner Rotation","This master rotation deliberately changes protein, cooking method and flavour. Swap recipes within the same category whenever","preferred.","DAY DINNER METHOD","W1 Mon Paprika chicken rice bowl Air fryer","W1 Tue Beef & spinach curry Hob","W1 Wed Salmon sweet-potato traybake Oven","W1 Thu Turkey meatballs + potatoes Air fryer","W1 Fri Chicken roasted-pepper pizza Pizza oven","W1 Sat Steak bowl Hob","W1 Sun Slow-cooker chicken Slow cooker","W2 Mon Turkey red-lentil curry Hob","W2 Tue Prawn noodle bowl Hob","W2 Wed Steak bites + potatoes Air fryer","W2 Thu Chicken quinoa bowl Air fryer","W2 Fri Turkey burger pizza Pizza oven","W2 Sat Salmon quinoa bowl Oven","W2 Sun Beef root-veg stew Slow cooker","4-Week Master Dinner Rotation - Weeks 3 & 4","DAY DINNER METHOD","W3 Mon Chicken fajita potato bowl Air fryer","W3 Tue Beef sweet-potato curry Hob","W3 Wed Prawn paprika potato bowl Air fryer","W3 Thu Turkey stuffed peppers Air fryer","W3 Fri Steak mushroom pizza Pizza oven","W3 Sat Salmon egg recovery plate Air fryer/hob","W3 Sun Slow-cooker turkey potato curry Slow cooker","W4 Mon Chicken potato curry Hob","W4 Tue Tuna potato egg salad Cold","W4 Wed Turkey kofta quinoa bowl Air fryer","W4 Thu Shredded paprika beef + rice Slow cooker","W4 Fri Chicken curry pizza Pizza oven","W4 Sat Salmon tomato-ginger curry Hob","W4 Sun Freezer-choice meal + fresh vegetables Freezer","How to repeat this across the year","Repeat the four-week structure while swapping individual recipes from Parts 1-11. Keeping the category stable - poultry, beef, fish,","pizza, slow cooker - preserves planning simplicity while changing flavours and ingredients.","Breakfast, Snack & Dessert Rotation","DAY BREAKFAST SNACK SWEET OPTION","Mon Breakfast shake Fruit + protein if needed Frozen berry protein bowl","Tue Breakfast shake Protein muffins No planned dessert","Wed Breakfast shake Fruit/protein Apple-cinnamon oat pot","Thu Breakfast shake Banana-oat bites No planned dessert","Fri Breakfast shake Protein snack Frozen pop","Sat Protein pancakes / shake As needed Planned dessert","Sun Shake / eggs-based breakfast As needed Berry crumble or brownie portion","Rotation rule","Snacks are optional rather than mandatory. Use them when meal timing, training or genuine hunger makes them useful. Planned","desserts can be rotated rather than eaten automatically every night.","Cooking-Appliance Weekly Schedule","Spread cooking across the equipment already used in the recipe manual.","DAY PRIMARY METHOD ROLE","Sunday Slow cooker + oven Batch meal + vegetables","Monday Air fryer Fast poultry meal","Tuesday Hob Curry / rice bowl","Wednesday Air fryer/oven Fresh fish + midweek top-up","Thursday Hob/air fryer Turkey/beef quick meal","Friday Pizza oven Controlled pizza night","Saturday Flexible Steak/fish/curry/family meal","Why this works","Using different appliances creates texture and flavour variation even when the core ingredients are similar. It also prevents meal","prep from feeling like seven identical plastic containers.","Seasonal Rotation Framework","Use the same meal architecture while changing vegetables, herbs and cooking style through the year.","SEASON EMPHASIS STYLE","Winter Slow-cooker stews, curries, root vegetables Warm batch meals","Spring Lighter bowls, asparagus, greens, herbs Fresh transition","Summer Salads, cold bowls, grilled/air-fried proteins Less heavy meals","Autumn Roasted vegetables, sweet potato, curries Return to batch cooking","Seasonal substitutions should still respect the established personal intolerance framework and ingredient-label checks.","Eating Out & Weekend Flexibility","The manual should support normal life rather than requiring perfect home cooking.","SITUATION APPROACH NOTE","Lean steak + potato/rice + vegetables; sauce on","Restaurant steak Simple","side","Tomato-based grilled/curry option where","Indian-style meal Watch creamy/coconut sauces","ingredients can be confirmed","Plain rice + simply cooked meat/vegetables","Chinese-style meal Sauces may contain excluded ingredients","where ingredients can be confirmed","Pizza night Use home pizza system when possible Known ingredients/macros","Keep protein/vegetables strong; adjust other","Family meal No compensation/starvation","meals normally","Weekend rule","One higher-energy meal does not require skipping meals before or after it. Keep the rest of the day structured, stay hydrated, and","return to the normal plan at the next meal.","Food Storage & Reheating Reference","Use packaging and local food-safety guidance where it is more specific. When uncertain, choose the shorter storage horizon.","FOOD STORAGE PRINCIPLE REHEAT","Cooked poultry/beef Cool promptly; refrigerate short-term Reheat thoroughly","Cooked fish/seafood Shorter prep horizon Reheat once or eat properly chilled","Cooked rice Cool promptly in shallow portions Keep chilled; reheat thoroughly","Cooked potato/quinoa Cool promptly Reheat until hot","Slow-cooker meals Freeze surplus early Defrost chilled; reheat thoroughly","Cold lunch boxes Keep continuously chilled Use insulated transport if needed","Quality rule","The meal-prep plan intentionally uses Sunday plus a midweek refresh rather than assuming all foods should be held for an entire","working week.","Weekly Review Sheet","Complete this in two minutes before choosing next week's meals.","REVIEW NOTES","Body-weight trend ____________________________","Waist / progress marker ____________________________","Training energy (1-5) ____________________________","Hunger (1-5) ____________________________","Sleep quality (1-5) ____________________________","Digestion / tolerance ____________________________","Meals to repeat ____________________________","Meals to replace ____________________________","Freezer meals remaining ____________________________","Shopping waste this week ____________________________","Adjustment decision","SIGNAL NEXT MOVE","Everything progressing Keep portions and rotation stable","Very hungry / low energy Review calories, carbs, meal timing and sleep","Training weak Review recovery and pre/post-training food","Food boredom Swap recipes, not the whole system","Too much waste Buy less fresh food; use freezer stock","52-Week Rotation Map","Use thirteen four-week cycles. Each cycle keeps the planning structure but changes several meals.","CYCLE WEEKS FOCUS","Cycle 1 Weeks 1-4 Learn portions and prep rhythm","Cycle 2 Weeks 5-8 Swap 4 dinners","Cycle 3 Weeks 9-12 Add more fish/air-fryer variety","Cycle 4 Weeks 13-16 Refresh curry rotation","Cycle 5 Weeks 17-20 Refresh pizza/treat rotation","Cycle 6 Weeks 21-24 Summer/light bowl emphasis","Cycle 7 Weeks 25-28 Swap 5 lunches/dinners","Cycle 8 Weeks 29-32 Slow-cooker refresh","Cycle 9 Weeks 33-36 New spice/flavour combinations","Cycle 10 Weeks 37-40 Autumn roasted meals","Cycle 11 Weeks 41-44 Freezer-bank reset","Cycle 12 Weeks 45-48 Favourite-meal consolidation","Cycle 13 Weeks 49-52 Best-of-year rotation + review","This is a framework rather than 364 rigid menus. The detailed recipes already created become the interchangeable meal library","inside it.","Part 12 - Quick Reference","WHEN SYSTEM","Sunday 75-minute core prep + freeze surplus","Wednesday 25-minute fresh top-up","Daily Choose protein + starch + vegetables + flavour","Training day Increase starch before cutting/adding random snacks","Rest day Use lighter starch portion if appropriate","Friday/weekend Use planned pizza/treat or flexible meal","Freezer Maintain 7-10 mixed emergency portions","Weekly review Adjust from trends, not one day's scale weight","Book 3 progression","Parts 1-11 provide the detailed recipe library; Part 12 provides the system that makes the library sustainable across the year. The next","section can move into a consolidated master index, recipe finder, macro finder and final reference pages before Book 3 is assembled","into one complete A4 manual.","V4 packaged-ingredient rule: for passata, stock, plant drink, protein powder, baking powder, canned foods and other labelled products, use a version","free from the report's high/moderate reactive foods and flagged additives. If the label is uncertain, use a simpler whole-food alternative."],"meal":"Other","sensHigh":[],"sensMod":[]},{"title":"Buckwheat & Blueberry Pancakes","subtitle":"Wheat-free, dairy-free breakfast \u2022 2 servings (6 pancakes) \u2022 Prep 10 min \u2022 Cook 12 min \u2022 Equipment: bowl + non-stick pan","macros":{"energy":"~480 kcal","protein":"~24 g","carbs":"~58 g","fat":"~15 g","fibre":"~7 g"},"ingredients":["Buckwheat flour 120 g","Large eggs 2","Rice milk, unsweetened 200 ml","Baking powder 5 g","Cinnamon 2 g","Blueberries 150 g","Sunflower oil, for frying 10 ml","Maple syrup, to serve 20 g"],"method":["Whisk buckwheat flour, baking powder and cinnamon together in a bowl.","Add eggs and rice milk, whisking to a smooth, thick batter.","Fold through half the blueberries.","Heat sunflower oil in a non-stick pan over medium heat.","Cook pancakes 2-3 min per side until golden and set, working in batches.","Serve stacked with the remaining blueberries and a drizzle of maple syrup."],"storage":"Cool fully, layer with baking paper and refrigerate k gently in a saucepan (do not boil).","Stir in the cooked rice, chia seeds, cinnamon and honey.","Divide between two jars and refrigerate overnight, stirring once after 30 min to stop the chia clumping.","Top with diced mango just before eating."],"storage":"Keeps in the fridge, without the mango topping, for up to 3 days.","variations":["Swap mango for pineapple or a mix of berries.","Use oat milk instead of rice milk.","Add a spoon of almond butter for extra protein and creaminess."],"meal":"Breakfast","sensHigh":[],"sensMod":[]},{"title":"Grilled Chicken & Quinoa Power Salad","subtitle":"High-protein lunch \u2022 1 large bowl \u2022 Prep 15 min \u2022 Cook 15 min \u2022 Equipment: grill pan + saucepan","macros":{"energy":"~540 kcal","protein":"~48 g","carbs":"~44 g","fat":"~18 g","fibre":"~8 g"},"ingredients":["Chicken breast 180 g","Quinoa, dry weight 70 g","Mixed salad greens 60 g","Cucumber, sliced 80 g","Pomegranate seeds 40 g","Olive oil 15 ml","Lemon juice 15 ml","Salt & black pepper to taste"],"method":["Cook quinoa according to packet instructions, then cool slightly.","Season chicken breast and grill or pan-fry 6-7 min per side until cooked through; rest, then slice.","Toss salad greens, cucumber and cooked quinoa in a bowl.","Top with sliced chicken and pomegranate seeds.","Whisk olive oil and lemon juice, season, and drizzle over just before eating."],"storage":"Keep components separate in the fridge up to 3 days; combine and dress just before eating.","variations":["Swap chicken for grilled tuna steak or prawns.","Add avocado for extra healthy fats.","Use rice or buckwheat in place of quinoa."],"meal":"Lunch","sensHigh":[],"sensMod":[]},{"title":"Tuna & Rice Ni\u00e7oise-Style Bowl","subtitle":"Protein-packed lunch bowl \u2022 1 large bowl \u2022 Prep 15 min \u2022 Cook 12 min \u2022 Equipment: saucepan","macros":{"energy":"~520 kcal","protein":"~44 g","carbs":"~46 g","fat":"~17 g","fibre":"~6 g"},"ingredients":["Tuna steak 150 g (or tinned tuna in s y for chicken or lean pork mince.","Use pineapple instead of mango in the salsa.","Add shredded carrot for extra crunch."],"meal":"Lunch","sensHigh":[],"sensMod":[]},{"title":"Baked Salmon with Sweet Potato Mash & Greens","subtitle":"Omega-3 rich dinner \u2022 1 serving \u2022 Prep 10 min \u2022 Cook 25 min \u2022 Equipment: oven + saucepan","macros":{"energy":"~560 kcal","protein":"~42 g","carbs":"~38 g","fat":"~26 g","fibre":"~7 g"},"ingredients":["Salmon fillet 180 g","Sweet potato 250 g","Tenderstem broccoli 100 g","Olive oil 15 ml","Lemon, half 1","Garlic, crushed 1 clove","Salt & black pepper to taste"],"method":["Preheat oven to 200\u00b0C (180\u00b0C fan). Peel and chop sweet potato, boil 15-18 min until tender.","Meanwhile place salmon on a lined tray, season, drizzle with half the oil and top with a squeeze of lemon.","Bake salmon 12-15 min until just cooked through.","Steam or blanch the broccoli 3-4 min until bright green and tender.","Drain and mash the sweet potato with remaining oil and crushed garlic; season to taste.","Serve salmon over the mash with broccoli alongside."],"storage":"Best eaten fresh; mash keeps in the fridge up to 2 days.","variations":["Swap salmon for trout or mackerel.","Use regular potato or butternut squash mash instead.","Add chilli flakes to the salmon before baking."],"meal":"Dinner","sensHigh":[],"sensMod":[]},{"title":"Beef & Black Bean Chilli with Rice","subtitle":"Hearty batch-cook dinner \u2022 4 servings \u2022 Prep 15 min \u2022 Cook 35 min \u2022 Equipment: large pot","macros":{"energy":"~510 kcal","protein":"~36 g","carbs":"~48 g","fat":"~17 g","fibre":"~11 g"},"ingredients":["Lean beef mince 500 g","Black beans, drained 400 g","Chopped tomatoes 400 g","Red pepper, diced 1","Onion, diced 1","Garlic, crushed 2 cloves","Cumin 5 g","Paprika 5 g","Chilli powder 3 g","Olive oil 15 ml","Cooked rice, to serve 200 g per portion"],"method":["Heat oil in a large pot and cook onion and pepper 5 min until softening.","Add garlic, cumin, paprika and chilli powder; cook 1 min until fragrant.","Add beef mince and brown thoroughly, breaking it up as it cooks.","Stir in chopped tomatoes and black beans; simmer uncovered 20-25 min, stirring occasionally, until thickened.","Season to taste and serve over cooked rice."],"storage":"Keeps in the fridge up to 4 days or freeze in portions up to 3 months.","variations":["Swap beef for turkey or lean pork mince.","Use kidney beans in place of black beans.","Serve over quinoa or baked sweet potato instead of rice."],"meal":"Dinner","sensHigh":[],"sensMod":[]},{"title":"Herby Chicken & Buckwheat Traybake","subtitle":"One-tray dinner \u2022 2 servings \u2022 Prep 10 min \u2022 Cook 35 min \u2022 Equipment: oven tray + saucepan","macros":{"energy":"~530 kcal","protein":"~40 g","carbs":"~42 g","fat":"~20 g","fibre":"~7 g"},"ingredients":["Chicken thighs, skin-on 4","Buckwheat groats, dry weight 140 g","Carrots, chopped 150 g","Red onion, wedges 1","Rosemary, fresh 2 sprigs","Olive oil 20 ml","Garlic, whole cloves 3","Salt & black pepper to taste"],"method":["Preheat oven to 200\u00b0C (180\u00b0C fan).","Toss chicken thighs, carrots, red onion and garlic with olive oil, rosemary, salt and pepper on a tray.","Roast 35-40 min, turning once, until chicken is cooked through and vegetables are tender.","Meanwhile cook buckwheat groats according to packet instructions.","Serve chicken and vegetables over the buckwheat, spooning over any pan juices."],"storage":"Keeps in the fridge up to 3 days. Reheat thoroughly before serving.","variations":["Swap chicken thighs for drumsticks or a whole spatchcocked chicken (adjust cook time).","Use quinoa or rice instead of buckwheat.","Add parsnips or butternut squash to the tray."],"meal":"Dinner","sensHigh":[],"sensMod":[]},{"title":"Prawn & Rice Noodle Stir-Fry","subtitle":"Quick weeknight dinner \u2022 2 servings \u2022 Prep 12 min \u2022 Cook 10 min \u2022 Equipment: wok or large frying pan","macros":{"energy":"~440 kcal","protein":"~32 g","carbs":"~52 g","fat":"~11 g","fibre":"~4 g"},"ingredients":["Raw king prawns 250 g","Rice noodles, dry weight 150 g","Red pepper, sliced 1","Carrot, julienned 1","Spring onion, sliced 3","Garlic, crushed 2 cloves","Ginger, grated 10 g","Fish sauce 15 ml","Lime, juiced 1","Sunflower oil 15 ml","Fresh chilli, sliced 1 (optional)"],"method":["Soak rice noodles in boiling water according to packet instructions; drain and set aside.","Heat oil in a wok over high heat. Add garlic and ginger, stir-fry 30 sec.","Add prawns and stir-fry 2-3 min until just turning pink.","Add pepper and carrot, stir-fry a further 2-3 min until just tender.","Add drained noodles, fish sauce and lime juice; toss everything together over heat for 1-2 min.","Scatter with spring onion and chilli to serve."],"storage":"Best eaten fresh; prawns do not reheat well from frozen leftovers.","variations":["Swap prawns for sliced chicken breast or thin strips of beef.","Use rice instead of rice noodles.","Add beansprouts or pak choi for extra veg."],"meal":"Dinner","sensHigh":[],"sensMod":[]},{"title":"Almond & Date Energy Bites","subtitle":"No-bake snack \u2022 12 bites \u2022 Prep 15 min \u2022 Chill 30 min \u2022 Equipment: food processor","macros":{"energy":"~140 kcal per bite","protein":"~4 g","carbs":"~15 g","fat":"~7 g","fibre":"~2 g"},"ingredients":["Medjool dates, pitted 200 g","Almonds 100 g","Pumpkin seeds 30 g","Cinnamon 3 g","Honey 10 g","Pinch of salt"],"method":["Blitz almonds and pumpkin seeds in a food processor until roughly chopped.","Add dates, cinnamon, honey and salt; process until the mixture starts to clump together.","Roll into 12 balls, pressing firmly.","Chill 30 min to firm up before eating."],"storage":"Keeps in an airtight container in the fridge up to 2 weeks, or freeze up to 2 months.","variations":["Roll in desiccated coconut alternative like ground pumpkin seed for coating (if avoiding coconut).","Swap almonds for macadamia or brazil nuts.","Add cacao
